<!doctype html>
<html lang="tr" class="boot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F2EC">
<title>Yemek Yapalım</title>
<meta name="apple-mobile-web-app-title" content="Yemek Yapalım">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F2EC;--paper2:#E7E5DE;--card:#FCFBF8;--card-rgb:252 251 248;--ink:#1B2A3D;--ink2:#5F6C7D;--ink3:#33445A;--ink-rgb:27 42 61;
  --line:rgb(var(--ink-rgb) / .13);--clay:#2A68AD;--clay-rgb:42 104 173;--danger:#1C438C;--danger-rgb:28 67 140;
  --fabc:#274A74;--go:var(--fabc);--go-rgb:39 74 116;--sun:#D9A23C;--olive:#5F6B3C;--cream:#F8FBFE;--cream-rgb:248 251 254;
  --mute:#A3AFBE;--mute-a:#9EAAB9;--mute-b:#A6B1BF;--shd-rgb:24 52 92;--dk-rgb:10 20 36;--dk2-rgb:6 12 22;
  --c1:38 78 128;--c2:27 58 100;--c3:13 26 46;--cookink:#14304F;--nx1:#FFFFFF;--nx2:#E4EEF9;--g1:#A9D0F6;--g2:#5FA2E6;
  --onacc:#fff;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--H:100vh;
  --ease:cubic-bezier(.22,.9,.24,1);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:var(--H);min-height:100%;overflow:hidden;background:var(--paper);overscroll-behavior:none}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img,canvas{-webkit-touch-callout:none;-webkit-user-drag:none;user-drag:none;-webkit-user-select:none;user-select:none}
img{pointer-events:none}
input,textarea{-webkit-user-select:text;user-select:text;font-family:var(--sans);color:var(--ink)}
button{font-family:var(--sans);cursor:pointer;color:inherit}
#app{position:absolute;left:0;right:0;top:0;height:var(--H);overflow:hidden;background:var(--paper)}
#grain{display:none}
/* Doku yalnızca kâğıt zeminlerde; kartlar, fotoğraflar, butonlar ve yazılar temiz kalır */
.view,.body,.sheet,.pbar{background-image:var(--grain,none);background-size:140px 140px}
.view{position:absolute;inset:0;background:var(--paper);will-change:transform}
.view.push{box-shadow:-18px 0 50px rgb(var(--ink-rgb) / .14)}
.dim{position:absolute;inset:0;background:rgb(var(--dk-rgb) / .16);pointer-events:none}
.view[inert]{pointer-events:none}
#home{z-index:1}
/* Açılış: veriler ve yazı tipleri hazır olana kadar ana ekran görünmez; sonra yumuşakça gelir */
html.boot #home{visibility:hidden}
html.boot #home *{animation:none!important}
.fbd:empty{display:none}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.ic{display:block;pointer-events:none}
.tap{transition:transform .35s var(--ease),filter .3s,opacity .3s}
.tap:active{transform:scale(.955);filter:brightness(.94)}

/* ---------- Ana sayfa ---------- */
.head{padding:calc(var(--st) + 26px) 26px 0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);font-weight:600;animation:rise .8s var(--ease) both}
.h1{font-family:var(--serif);font-weight:400;font-size:48px;line-height:1.02;letter-spacing:-.025em;margin-top:10px;font-variation-settings:"SOFT" 100,"opsz" 144;animation:rise .9s .08s var(--ease) both}
.h1 em{font-style:italic;color:var(--clay)}
.search{position:relative;margin:26px 26px 0;display:flex;align-items:center;gap:12px;height:48px;border-bottom:1px solid var(--line);animation:rise .9s .16s var(--ease) both}
.search::after{content:'';position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--clay);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.search:focus-within::after{transform:scaleX(1)}
.search input{flex:1;background:none;border:0;outline:0;font-size:17px;height:100%;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--mute-a)}
.search input::-webkit-search-cancel-button{display:none}
.clr{width:30px;height:30px;border:0;background:var(--paper2);border-radius:50%;display:grid;place-items:center;opacity:0;transform:scale(.6);pointer-events:none;transition:all .35s var(--ease)}
.clr.on{opacity:1;transform:none;pointer-events:auto}
.cats{overflow-x:auto;scrollbar-width:none;padding:0 26px;margin-top:22px;animation:rise .9s .24s var(--ease) both}
.cats::-webkit-scrollbar{display:none}
.catsrow{display:flex;align-items:flex-start;margin-top:22px;padding-left:26px}
.catsrow .cats{flex:1;min-width:0;margin-top:0;padding-left:16px;animation:none}
.catback{flex:none;width:24px;height:38px;margin:0 -8px 0 0;background:none;border:0;display:grid;place-items:center;padding:0}
.cats-in{position:relative;display:flex;gap:24px;width:max-content;padding-bottom:16px}
.cat{background:none;border:0;padding:4px 0;font:400 25px var(--serif);font-variation-settings:"SOFT" 100,"opsz" 72;letter-spacing:-.01em;color:var(--mute-b);transition:color .35s;white-space:nowrap}
.cat.on{color:var(--ink)}
.brush{position:absolute;left:-14px;bottom:0;height:14px;width:calc(100% + 28px);pointer-events:none}
.info{display:flex;justify-content:space-between;align-items:center;padding:6px 26px 18px;animation:rise .9s .3s var(--ease) both}
.count{font-size:13px;color:var(--ink2)}
.sortb{display:flex;align-items:center;gap:8px;background:none;border:0;font-size:13px;color:var(--ink2);padding:6px 0 6px 10px}
.list{padding-bottom:calc(var(--sb) + 150px)}
.card{display:block;margin:0 20px 30px;animation:rise .8s var(--ease) both;animation-delay:calc(var(--i)*70ms);cursor:pointer}
.list.quick .card{animation:fade .32s both;animation-delay:0s}
.card .ph{position:relative;aspect-ratio:4/3.15;border-radius:28px;overflow:hidden;background:var(--paper2);box-shadow:0 22px 34px -20px rgb(var(--shd-rgb) / .55)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s var(--ease)}
.card:active .ph img{transform:scale(1.04)}
.card .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgb(var(--dk-rgb) / .35),rgb(var(--dk-rgb) / 0) 45%);pointer-events:none}
.badge{position:absolute;left:16px;bottom:14px;z-index:2;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);font-weight:600}
.card .tt{font:400 26px/1.12 var(--serif);letter-spacing:-.015em;margin:16px 6px 0;font-variation-settings:"SOFT" 100,"opsz" 96}
.card .mt{display:flex;justify-content:space-between;align-items:center;margin:8px 6px 0;font-size:13.5px;color:var(--ink2)}
.none{padding:50px 40px;text-align:center;color:var(--ink2);font-size:15px;animation:fade .5s both}
.empty{display:flex;flex-direction:column;align-items:center;padding:60px 40px;text-align:center}
.empty h3{font:400 28px var(--serif);font-variation-settings:"SOFT" 100,"opsz" 96}
.empty p{color:var(--ink2);font-size:15px;line-height:1.5;margin-top:8px;max-width:260px}

.fab{position:absolute;left:50%;bottom:calc(var(--sb) + 20px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:58px;padding:0 26px 0 22px;border-radius:29px;background:var(--fabc);color:var(--cream);font:600 16px var(--sans);border:0;box-shadow:0 16px 28px -12px rgb(var(--go-rgb) / .7),inset 0 1px 0 rgba(255,255,255,.18);z-index:20;transition:transform .45s var(--ease),padding .45s var(--ease),gap .45s var(--ease),opacity .35s}
.fab:active{transform:translateX(-50%) scale(.95)}
.fab span{max-width:160px;overflow:hidden;white-space:nowrap;transition:max-width .45s var(--ease),opacity .3s}
.fab.mini{gap:0;padding:0 20px}
.fab.mini span{max-width:0;opacity:0}
.fab.sun{background:var(--fabc)}
/* Detay: Pişirmeye başla — alt çubuk. İçerik arkasında yumuşakça kaybolur, metni kesmez */
.cookfade{position:absolute;left:0;right:0;bottom:0;height:calc(var(--sb) + 118px);background:linear-gradient(to top,var(--paper) 38%,transparent);pointer-events:none;z-index:19}
.fab.cookbar{left:20px;right:88px;transform:none;justify-content:center;height:56px;padding:0 22px;border-radius:28px;gap:10px;bottom:calc(var(--sb) + 16px);box-shadow:0 14px 26px -14px rgb(var(--go-rgb) / .75),inset 0 1px 0 rgba(255,255,255,.16)}
.fab.cookbar:active{transform:scale(.975)}
.fab.cookbar span{max-width:none}
.fab.cookbar small{font:500 13.5px var(--sans);opacity:.72;margin-left:2px}
.donebtn{position:absolute;right:20px;bottom:calc(var(--sb) + 16px);width:56px;height:56px;border-radius:50%;border:1.5px solid rgb(var(--clay-rgb) / .35);background:var(--card);display:grid;place-items:center;z-index:20;box-shadow:0 12px 22px -14px rgb(var(--shd-rgb) / .55);transition:background .4s var(--ease),border-color .4s var(--ease),transform .35s var(--ease);touch-action:manipulation}
.donebtn.on{background:var(--clay);border-color:var(--clay)}
.donebtn:active{transform:scale(.9)}
.donebtn.pop{animation:dpop .7s var(--ease)}
.donebtn.cd::after{content:'';position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(rgb(var(--clay-rgb) / .55) var(--p,0deg),transparent 0);-webkit-mask:radial-gradient(circle,transparent 29px,#000 30px);mask:radial-gradient(circle,transparent 29px,#000 30px);animation:dcd 2.2s linear forwards}
@property --p{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes dcd{from{--p:360deg}to{--p:0deg}}
.donebtn.pop .ic{animation:dchk .6s var(--ease)}
.donebtn .nb{position:absolute;top:-5px;right:-3px;min-width:20px;height:20px;border-radius:10px;padding:0 5px;background:var(--ink);color:var(--paper);font:600 11.5px/20px var(--sans);text-align:center;border:2px solid var(--paper);box-sizing:content-box}
@keyframes dpop{0%{transform:scale(.82)}35%{transform:scale(1.14)}65%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes dchk{0%{transform:scale(.3) rotate(-24deg);opacity:0}60%{transform:scale(1.25) rotate(4deg);opacity:1}100%{transform:none}}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.fxflash{position:absolute;inset:0;pointer-events:none;z-index:39;background:radial-gradient(90% 60% at 85% 100%,rgb(var(--clay-rgb) / .28),transparent 70%);opacity:0}

/* ---------- Detay ---------- */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:calc(var(--H)*.52);scrollbar-width:none;background:var(--paper2)}
.gal::-webkit-scrollbar{display:none}
.gi{flex:0 0 100%;scroll-snap-align:center;position:relative;overflow:hidden}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.vt{background:#2a1f17;display:grid;place-items:center}
.vt img{position:absolute;inset:0;opacity:.7}
.vt .pl{position:relative;z-index:2;width:74px;height:74px;border-radius:50%;background:rgb(var(--cream-rgb) / .22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.35);padding-left:4px}
.vt small{position:absolute;z-index:2;bottom:64px;left:0;right:0;text-align:center;color:var(--cream);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.edge{position:absolute;left:0;top:0;bottom:0;width:18px;z-index:60;touch-action:none}
.gw{position:relative;transform-origin:50% 0;will-change:transform;backface-visibility:hidden}
.scroll.stretch{overscroll-behavior-y:auto}
.cap{position:absolute;left:0;right:0;bottom:100%;height:260px;overflow:hidden;pointer-events:none;background:var(--topc,var(--paper2))}
.dots{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:center;gap:6px;z-index:4;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition:all .45s var(--ease)}
.dots i.on{width:22px;background:#fff}
.dots.dk i{background:rgb(var(--ink-rgb) / .3)}
.dots.dk i.on{background:var(--ink)}
.body{position:relative;margin-top:-30px;background:var(--paper);border-radius:32px 32px 0 0;padding:30px 26px calc(var(--sb) + 150px);z-index:3}
.kicks{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.kick{display:flex;align-items:center;gap:10px;font:italic 400 20px/1.2 var(--serif);letter-spacing:0;color:var(--clay);font-variation-settings:"SOFT" 100,"opsz" 72}
.ktag{display:flex;align-items:center;gap:12px;font:500 13.5px var(--sans);color:var(--ink2)}
.ktag::before{content:'';width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.55;flex:none}
.dt{font:400 38px/1.05 var(--serif);letter-spacing:-.025em;margin-top:8px;font-variation-settings:"SOFT" 100,"opsz" 144}
.rate{margin-top:18px;display:flex;align-items:center;gap:12px}
.rate{gap:14px}
.rn{font-size:26px;display:flex;align-items:center;height:1.15em;padding-left:14px;border-left:1px solid var(--line)}
.rw{position:relative;display:inline-block;height:1.15em;min-width:.5em;transition:width .34s var(--ease)}
.rd{display:block;white-space:nowrap;font:400 1em/1.15 var(--serif);font-variation-settings:"SOFT" 100,"opsz" 72;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em;color:var(--ink)}
.rd.z{color:var(--mute)}
.rn small{font:500 .5em var(--sans);color:var(--ink2);margin-left:3px;transform:translateY(.28em)}
.rsn{display:flex;justify-content:center;margin-top:12px}
.rsn .rn{font-size:40px;border:0;padding:0}
.rsh{text-align:center;font-size:12.5px;color:var(--ink2);margin-top:10px}
.meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta div{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.sec{font:italic 400 28px var(--serif);margin:38px 0 6px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;font-variation-settings:"SOFT" 100,"opsz" 72}
.sec small{font:500 13px var(--sans);color:var(--ink2);font-style:normal}
.ing{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line);font-size:17px;line-height:1.35;cursor:pointer}
.ing span{transition:color .3s,opacity .3s;position:relative}
.ing.done span{color:var(--ink2);opacity:.6;text-decoration:line-through;text-decoration-color:rgb(var(--ink-rgb) / .4)}
.stp{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
.stp b{font:italic 300 34px/1 var(--serif);color:var(--clay);min-width:36px;font-variation-settings:"SOFT" 100,"opsz" 144}
.stp p{font-size:17px;line-height:1.6;padding-top:3px}
.note{margin-top:30px;padding:18px 20px;background:var(--paper2);border-radius:20px;border-left:3px solid var(--clay);font-size:15.5px;line-height:1.55;color:var(--ink3)}
.fbtn{position:absolute;top:calc(var(--st) + 10px);width:44px;height:44px;border-radius:50%;background:rgb(var(--card-rgb) / .8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:0;display:grid;place-items:center;z-index:6;box-shadow:0 8px 20px -8px rgba(0,0,0,.35)}

/* ---------- Varyasyonlar ---------- */
.vchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:20px -26px 0;padding:2px 26px}
.vchips::-webkit-scrollbar{display:none}
.vc{flex:none;height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);background:none;font:500 14px var(--sans);color:var(--ink2);transition:all .45s var(--ease);display:flex;align-items:center;gap:6px}
.vc.on{background:var(--go);border-color:var(--go);color:#fff}
.vc.add{border:1px solid rgb(var(--clay-rgb) / .22);background:rgb(var(--clay-rgb) / .09);color:var(--clay);font-weight:600;padding:0 16px 0 12px;gap:5px}
.vc.add svg{flex:none}
.vname{font:italic 400 24px var(--serif);color:var(--clay);margin-top:6px;font-variation-settings:"SOFT" 100,"opsz" 72}
.ing.new{background:linear-gradient(90deg,rgb(var(--clay-rgb) / .08),transparent)}
.ing .nw{margin-left:auto;font:600 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--clay)}
.outl{margin-top:12px;font-size:13.5px;color:var(--ink2);line-height:1.5}
.vsh{max-height:calc(var(--H)*.74);overflow-y:auto;scrollbar-width:none;margin:0 -24px;padding:0 24px}
.vsh::-webkit-scrollbar{display:none}
.sheet.tall{display:flex;flex-direction:column;top:0;bottom:0;max-height:none;border-radius:0;padding:calc(var(--st) + 22px) 24px calc(var(--sb) + 18px);box-shadow:none}
.sheet.tall .grab{display:none}
.vbox{display:flex;flex-direction:column;flex:1;min-height:0}
.vbox .sh-p{margin-bottom:0}
.vbox .vsh{flex:1;min-height:0;max-height:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.vbox .btns{flex:none}

.vsh-x{position:absolute;top:calc(var(--st) + 15px);right:16px;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;flex:none;z-index:2}
.vsh .in{margin-top:6px}
.vtog{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.vtog button{border:1px solid var(--line);background:none;border-radius:16px;padding:8px 13px;font:15px var(--sans);transition:all .35s var(--ease)}
.vtog button.off{text-decoration:line-through;color:var(--ink2);background:var(--paper2);opacity:.7}
.vph{height:84px;width:84px;border-radius:18px;border:1.5px dashed rgb(var(--clay-rgb) / .5);background:rgb(var(--clay-rgb) / .05) center/cover;display:grid;place-items:center;flex:none;overflow:hidden}
.badge.vb{left:auto;right:16px}
/* ---------- Pişirme modu ---------- */
/* Pişirme modu: derin zeytin yeşili zemin, sıcak krem ve amber vurgular */
.cook{background-color:rgb(var(--c3));background-image:radial-gradient(120% 65% at 92% -8%,rgb(var(--c1)) 0%,rgb(var(--c1) / 0) 62%),radial-gradient(70% 38% at 50% 52%,rgb(var(--c1) / .22) 0%,rgb(var(--c1) / 0) 100%),radial-gradient(90% 55% at -5% 108%,rgb(var(--c2)) 0%,rgb(var(--c2) / 0) 65%);background-size:auto;background-repeat:no-repeat;color:var(--cream)}
.cook .cbtn{border:1px solid rgb(var(--cream-rgb) / .14);background:rgb(var(--cream-rgb) / .08);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ctitle{position:absolute;left:0;right:0;top:calc(var(--st) + 66px);text-align:center;font:italic 400 16px var(--serif);color:rgb(var(--cream-rgb) / .62);padding:0 70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:4}
.ctitle em{color:var(--g1);font-style:italic}
.ctop{position:absolute;left:0;right:0;top:calc(var(--st) + 12px);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:5}
.cbtn{width:44px;height:44px;border-radius:50%;border:1px solid rgb(var(--cream-rgb) / .18);background:rgb(var(--cream-rgb) / .06);display:grid;place-items:center;flex:none}
.seg{flex:1;display:flex;gap:5px}
.seg i{flex:1;height:3px;border-radius:2px;background:rgb(var(--cream-rgb) / .16);overflow:hidden}
.seg b{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.seg i.done b{transform:scaleX(1)}
.stage{position:absolute;left:0;right:0;top:calc(var(--st) + 96px);bottom:calc(var(--sb) + 130px);overflow:hidden}
.step{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 28px}
.step .k{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--g1);font-weight:600;margin-bottom:22px}
.step .k::after{content:'';flex:1;height:1px;background:rgb(var(--cream-rgb) / .16)}

/* ============ Malzeme ayrıştırıcı ============
   Tarifte malzemeler düz metin olarak kalır (yedek / varyasyon uyumluluğu bozulmaz); yapı anlık çıkarılır.
   parseIng("2 su bardağı kırmızı mercimek (yıkanmış)") → {qty:2, unit:'su bardağı', fam:'vol', f:200, name:'kırmızı mercimek', note:'yıkanmış', key:'kirmizi mercimek'}
   fam: mass (g) / vol (ml) / count; f: o ailenin tabanına çarpan. Madde 10 (kiler), 18 (ölçekleme) bunu kullanır. */
const UNITS=[
  ['kg','mass',1000,['kg','kilo','kilogram']],['g','mass',1,['g','gr','gram']],
  ['lt','vol',1000,['lt','l','litre']],['ml','vol',1,['ml','mililitre']],
  ['su bardağı','vol',200,['su bardagi','bardak','sb']],['çay bardağı','vol',100,['cay bardagi','cb']],['kahve fincanı','vol',60,['kahve fincani','fincan']],
  ['yemek kaşığı','vol',15,['yemek kasigi','corba kasigi','kasik','yk']],['tatlı kaşığı','vol',10,['tatli kasigi','tk']],['çay kaşığı','vol',5,['cay kasigi','ck']],
  ['adet','count',1,['adet','tane']],['dilim','count',1,['dilim']],['diş','count',1,['dis']],['demet','count',1,['demet']],['paket','count',1,['paket']],
  ['kutu','count',1,['kutu']],['tutam','count',1,['tutam']],['avuç','count',1,['avuc']],['kase','count',1,['kase']],['parça','count',1,['parca']],
  ['yaprak','count',1,['yaprak']],['dal','count',1,['dal']],['kavanoz','count',1,['kavanoz']],['şişe','count',1,['sise']]

const UALIAS=UNITS.flatMap(u=>u[3].map(a=>[a,u])).sort((a,b)=>b[0].length-a[0].length);
const NUMW={bir:1,iki:2,uc:3,dort:4,bes:5,alti:6,yedi:7,sekiz:8,dokuz:9,on:10};
const numOf=x=>parseFloat(String(x).replace(',','.'));
function qtyHead(s){
  const f=fold(s);let m;
  if((m=f.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)/))&&+m[3])return{q:+m[1]+m[2]/m[3],n:m[0].length};
  if((m=f.match(/^(\d+)\s*\/\s*(\d+)/))&&+m[2])return{q:m[1]/m[2],n:m[0].length};
  if(m=f.match(/^(\d+(?:[.,]\d+)?)\s*[-–]\s*(\d+(?:[.,]\d+)?)/))return{q:numOf(m[1]),q2:numOf(m[2]),n:m[0].length};
  if(m=f.match(/^\d+(?:[.,]\d+)?/))return{q:numOf(m[0]),n:m[0].length};
  if(m=f.match(/^(yarim|yari|ceyrek)(?=\s|$)/))return{q:m[1]==='ceyrek'?.25:.5,n:m[0].length};
  if(m=f.match(/^(bir|iki|uc|dort|bes|alti|yedi|sekiz|dokuz|on)(?=\s)/))return{q:NUMW[m[1]],n:m[0].length};
  return null;
}
function parseIng(raw){
  const o={raw:String(raw),qty:null,qty2:null,unit:'',fam:'',f:1,name:'',note:'',free:false,key:''};
  let s=o.raw.trim().replace(/½/g,' 1/2').replace(/¼/g,' 1/4').replace(/¾/g,' 3/4').replace(/⅓/g,' 1/3').replace(/⅔/g,' 2/3').trim();
  const notes=[];
  s=s.replace(/\(([^)]*)\)/g,(_,t)=>{t.trim()&&notes.push(t.trim());return' '}).trim();
  for(let i=0;i<s.length;i++)if(s[i]===','&&!(/\d/.test(s[i-1]||'')&&/\d/.test(s[i+1]||''))){const t=s.slice(i+1).trim();t&&notes.push(t);s=s.slice(0,i).trim();break}
  const fm=fold(s).match(/^(yeteri kadar|istege gore|istege bagli|bir miktar|tadimlik|biraz|az miktarda)\s+/);
  if(fm){o.free=true;s=s.slice(fm[0].length)}
  const q=qtyHead(s);
  if(q){
    o.qty=q.q;if(q.q2)o.qty2=q.q2;s=s.slice(q.n).replace(/^[\s.\-–]+/,'');
    const fr=fold(s);
    for(const[a,u]of UALIAS){if(fr.startsWith(a)){const nx=fr[a.length];if(nx===undefined||/[\s.,]/.test(nx)){o.unit=u[0];o.fam=u[1];o.f=u[2];s=s.slice(a.length).replace(/^[\s.]+/,'');break}}}
  }
  const w=s.split(/\s+/).filter(Boolean);
  while(w.length>1&&/m[iu]s$/.test(fold(w[w.length-1])))notes.unshift(w.pop());
  o.name=w.join(' ');o.note=notes.join(', ');
  if(/istege gore|yeteri kadar|tadimlik/.test(fold(o.note)))o.free=true;
  if(!o.name){o.name=o.raw.trim();o.qty=o.qty2=null;o.unit=o.fam='';o.f=1}
  o.key=fold(o.name).replace(/^(orta|buyuk|kucuk)\s+boy\s+/,'').replace(/^(orta|buyuk|kucuk|iri)\s+(?=\S)/,'').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
  return o;
}
function fmtQty(q){
  if(q==null)return'';
  const r=Math.round(q*100)/100,w=Math.floor(r),fr=r-w;
  if(fr<.02)return String(w);if(fr>.98)return String(w+1);
  const hit=[[.5,'½'],[.25,'¼'],[.75,'¾'],[1/3,'⅓'],[2/3,'⅔'],[.125,'⅛']].find(([v])=>Math.abs(fr-v)<.02);
  return hit?(w?w+' ':'')+hit[1]:String(r).replace('.',',');
}
function fmtIng(p,k=1){

const whyMap=new Map(),idxCache=new WeakMap(),WHY=['','','','Etiketlerde','Malzemelerde','Notlarda'];
function idxOf(r){

  const t=fold(r.title);
  c={u:r.updated,n:vs.length,t,tw:t.split(/\s+/),ing:fold([...(r.ing||[]),...vs.flatMap(v=>v.add||[])].join('\n')),tags:fold((r.tags||[]).join('\n')),note:fold([r.note||'',...vs.map(v=>v.note||'')].join('\n'))};
  idxCache.set(r,c);return c;
}
const has=(text,t)=>t.length<3?(' '+text.replace(/\n/g,' ')).includes(' '+t):text.includes(t);
function rankTok(c,t){
  if(c.t.startsWith(t))return 0;
  if(c.tw.some(w=>w.startsWith(t)))return 1;
  if(t.length>=3&&c.t.includes(t))return 2;

const fCount=()=>{const F=state.f;return(F.time?1:0)+(F.rate?1:0)+(F.tags.length?1:0)};
function passF(r){
  const F=state.f;
  if(F.time){const m=parseInt(r.time,10);if(!Number.isFinite(m))return false;if(F.time===30?m>30:F.time===60?m>60:m<=60)return false}
  if(F.rate&&(r.rating||0)<F.rate)return false;

}
function filtered(){

/* ============ "Yapıldı" geri bildirimi: tüm sayfada konfeti + dalga + ışık ============ */
function celebrate(host,btn){
  host.querySelectorAll('.fx').forEach(c=>c.remove());
  const hr=host.getBoundingClientRect(),br=btn.getBoundingClientRect();
  const W=hr.width,H=hr.height,ox=br.left-hr.left+br.width/2,oy=br.top-hr.top+br.height/2;
  const flash=h('div',{class:'fxflash'});host.append(flash);
  flash.animate([{opacity:0},{opacity:1,offset:.22},{opacity:0}],{duration:950,easing:'ease-out'}).onfinish=()=>flash.remove();
  const [cv,x]=canvas(W,H);cv.className='fx';host.append(cv);
  const cols=[CLAY,SUN,CLAY2,'#F2C14E',CREAM,'#fff'];
  const P=Array.from({length:48},()=>{const a=-Math.PI*(.06+Math.random()*.88),v=380+Math.random()*760;
    return{x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*6.28,vr:(Math.random()-.5)*14,w:5+Math.random()*6,hh:3+Math.random()*5,c:cols[Math.random()*cols.length|0],round:Math.random()<.35}});
  const D=1400,t0=performance.now();let last=t0;
  const step=now=>{
    const t=now-t0,dt=Math.min(.04,(now-last)/1000);last=now;
    x.clearRect(0,0,W,H);
    const fade=Math.min(1,Math.max(0,(D-t)/450));
    P.forEach(p=>{p.vx*=Math.pow(.2,dt);p.vy=p.vy*Math.pow(.2,dt)+1250*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
      x.save();x.globalAlpha=fade;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
      if(p.round){x.beginPath();x.arc(0,0,p.hh*.8,0,7);x.fill()}else x.fillRect(-p.w/2,-p.hh/2,p.w,p.hh);x.restore()});
    if(t<D)requestAnimationFrame(step);else cv.remove();
  };
  requestAnimationFrame(step);
}

/* ============ Görsel büyütme ============ */
function openViewer(list,idx,srcEl){
  const lb=h('div',{class:'lb'}),strip=h('div',{class:'lbs'});
  let cur=idx,closing=false,dragging=false,dy=0,sx=0,sy=0,track=false;
  const close=()=>{
    if(closing)return;closing=true;
    const im=imgs[cur];
    [closeB,cnt].forEach(n=>n.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'}));
    if(cur===idx&&srcEl&&srcEl.isConnected&&!dragging){
      lb.animate([{backgroundColor:'rgba(20,14,10,.96)'},{backgroundColor:'rgba(20,14,10,0)'}],{duration:360,easing:EASE,fill:'forwards'});
      im.animate([{transform:'none'},flipFrom(im,srcEl.getBoundingClientRect())],{duration:360,easing:EASE,fill:'forwards'}).onfinish=()=>lb.remove();
    }else lb.animate([{opacity:1},{opacity:0}],{duration:260,easing:EASE,fill:'forwards'}).onfinish=()=>lb.remove();
  };
  const flipFrom=(im,r)=>{
    const b=im.getBoundingClientRect(),k=Math.max(r.width/b.width,r.height/b.height);
    return{transform:`translate(${r.left+r.width/2-(b.left+b.width/2)}px,${r.top+r.height/2-(b.top+b.height/2)}px) scale(${k})`,opacity:.4};
  };
  const imgs=list.map(b=>{const im=h('img',{src:urlOf(b),alt:''});strip.append(h('div',{class:'lbi',onclick:close},im));return im});
  const cnt=h('div',{class:'lbc'}),closeB=h('button',{class:'lbx tap',type:'button','aria-label':'Kapat',onclick:close},icon('close',24,CREAM,2));
  lb.append(strip,closeB,cnt);app.insertBefore(lb,$('#toast'));
  const upd=()=>{cnt.textContent=list.length>1?`${cur+1} / ${list.length}`:''};upd();
  strip.scrollLeft=idx*strip.clientWidth;
  strip.addEventListener('scroll',()=>{cur=Math.round(strip.scrollLeft/strip.clientWidth);upd()},{passive:true});
  lb.animate([{backgroundColor:'rgba(20,14,10,0)'},{backgroundColor:'rgba(20,14,10,.96)'}],{duration:360,easing:EASE});
  const first=imgs[idx],go=()=>{
    if(srcEl&&srcEl.isConnected)first.animate([flipFrom(first,srcEl.getBoundingClientRect()),{transform:'none',opacity:1}],{duration:440,easing:EASE});
    else first.animate([{opacity:0,transform:'scale(.92)'},{opacity:1,transform:'none'}],{duration:360,easing:EASE});
  };
  first.complete?go():(first.onload=go);
  [closeB,cnt].forEach(n=>n.animate([{opacity:0},{opacity:1}],{duration:360}));
  /* aşağı çekerek kapat */
  strip.addEventListener('touchstart',e=>{if(e.touches.length>1){track=false;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY;dy=0;dragging=false;track=true},{passive:true});
  strip.addEventListener('touchmove',e=>{
    if(!track||closing)return;const t=e.touches[0],mx=t.clientX-sx,my=t.clientY-sy;
    if(!dragging&&Math.abs(my)>10&&Math.abs(my)>Math.abs(mx)*1.4)dragging=true;
    if(dragging){dy=my;const a=Math.min(1,Math.abs(dy)/420);imgs[cur].style.transform=`translateY(${dy}px) scale(${1-a*.25})`;lb.style.backgroundColor=`rgba(20,14,10,${.96*(1-a)})`}
  },{passive:true});
  strip.addEventListener('touchend',()=>{
    if(!track)return;track=false;
    if(!dragging)return;
    if(Math.abs(dy)>110){close();return}
    dragging=false;const im=imgs[cur];
    im.style.transition='transform .3s '+EASE;lb.style.transition='background-color .3s';
    im.style.transform='';lb.style.backgroundColor='rgba(20,14,10,.96)';
    setTimeout(()=>{im.style.transition='';lb.style.transition=''},320);
  });
}

/* Sürükle-bırak sıralama: bırakmadan komşular kayıp yer açar */
function sortable(list,scroller,onCommit,onDone){
  let d=null,busy=false;
  const rows=()=>[...list.children];
  list.addEventListener('pointerdown',e=>{
    if(d||busy||(e.pointerType==='mouse'&&e.button!==0))return;
    const row=e.target.closest('.crow');if(!row||e.target.closest('.cdel'))return;
    const grip=!!e.target.closest('.grip'),p={id:e.pointerId,x:e.clientX,y:e.clientY};
    let timer=0;
    const stop=()=>{clearTimeout(timer);removeEventListener('pointermove',pm);removeEventListener('pointerup',pu);removeEventListener('pointercancel',pu)};
    const pm=ev=>{if(ev.pointerId===p.id&&Math.hypot(ev.clientX-p.x,ev.clientY-p.y)>9)stop()};
    const pu=ev=>{if(ev.pointerId===p.id)stop()};
    addEventListener('pointermove',pm);addEventListener('pointerup',pu);addEventListener('pointercancel',pu);
    if(grip){e.preventDefault();stop();start(row,p)}
    else timer=setTimeout(()=>{stop();start(row,p)},220);
  });
  function start(row,p){
    const rs=rows(),i=rs.indexOf(row);
    d={row,rs,n:rs.length,from:i,to:i,rowH:row.offsetHeight,id:p.id,x0:p.x,y0:p.y,x:p.x,y:p.y,sc0:scroller.scrollTop,raf:0};
    dragOn=true;sfx('tap');
    row.classList.add('lift');rs.forEach(r=>{if(r!==row)r.classList.add('slide')});list.classList.add('dragging');
    update();
    addEventListener('pointermove',move);addEventListener('pointerup',end);addEventListener('pointercancel',end);
    loop();
  }
  function move(ev){if(!d||ev.pointerId!==d.id)return;d.x=ev.clientX;d.y=ev.clientY;update()}
  function update(){
    const dy=d.y-d.y0+(scroller.scrollTop-d.sc0),dx=d.x-d.x0;
    const cy=Math.max(-d.from*d.rowH-14,Math.min((d.n-1-d.from)*d.rowH+14,dy));
    d.row.style.transform=`translate(${Math.max(-36,Math.min(36,dx*.4))}px,${cy}px) scale(1.035)`;
    const to=Math.max(0,Math.min(d.n-1,Math.round(d.from+cy/d.rowH)));
    if(to!==d.to){
      d.to=to;sfx('tap');
      d.rs.forEach((r,j)=>{
        if(r===d.row)return;let t=0;
        if(d.from<to&&j>d.from&&j<=to)t=-d.rowH;else if(to<d.from&&j>=to&&j<d.from)t=d.rowH;
        r.style.transform=t?`translateY(${t}px)`:'';
      });
    }
  }
  function loop(){
    if(!d)return;
    const r=scroller.getBoundingClientRect(),top=r.top+100,bot=r.bottom-100;let v=0;
    if(d.y<top)v=-(top-d.y)/5;else if(d.y>bot)v=(d.y-bot)/5;
    v=Math.max(-18,Math.min(18,v));
    if(v){const before=scroller.scrollTop;scroller.scrollTop+=v;if(scroller.scrollTop!==before)update()}
    d.raf=requestAnimationFrame(loop);
  }
  function end(ev){
    if(!d||ev.pointerId!==d.id)return;
    cancelAnimationFrame(d.raf);
    removeEventListener('pointermove',move);removeEventListener('pointerup',end);removeEventListener('pointercancel',end);
    const {row,rs,from,to,rowH}=d;d=null;busy=true;dragOn=false;
    row.classList.remove('lift');row.classList.add('settle');
    row.style.transition=`transform .28s ${EASE},box-shadow .26s,background .26s`;
    row.style.transform=`translateY(${(to-from)*rowH}px)`;
    setTimeout(()=>{
      rs.forEach(r=>{r.style.transition='none';r.style.transform='';r.classList.remove('slide','lift','settle')});
      if(to!==from)list.insertBefore(row,to>from?rs[to].nextSibling:rs[to]);
      void list.offsetHeight;rs.forEach(r=>r.style.transition='');
      list.classList.remove('dragging');busy=false;
      onDone&&onDone();
      if(to!==from)onCommit(rows().map(r=>r.dataset.id));
    },300);
  }
}

/* Kategori adı: ekle / yeniden adlandır */
function nameSheet(c,done){
  const inp=h('input',{class:'in',placeholder:'Kategori adı',value:c?c.name:'',maxlength:'24',autocomplete:'off',autocapitalize:'sentences',enterkeyhint:'done',spellcheck:'false'});
  const field=h('div',{class:'field'},inp);
  const submit=()=>{
    const v=inp.value.trim().replace(/\s+/g,' ');
    if(!v){field.animate(shake,{duration:420});toast('Bir ad yaz');return}
    if(cats.some(x=>x!==c&&fold(x.name)===fold(v))){field.animate(shake,{duration:420});toast('Bu kategori zaten var');return}
    inp.blur();s.close();done(v);
  };
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit()}};
  const box=h('div',{},h('div',{class:'sh-t'},c?'Adı değiştir':'Yeni kategori'),
    h('div',{style:'margin-top:18px'},field),

    h('button',{class:'bt tap',type:'button',onclick:submit},c?'Kaydet':'Ekle')));
  const s=sheet(box,{top:true});inp.focus();
  if(c)inp.select();
}

  /* Yemekler ve İçecekler tek kategoridir; kapaklar onların alt kategorilerinin önizlemesidir (4. eleman: bağlı kategori, 5.: alt kategori adı, 6.: alt kategori renkleri) */

  ['İçecekler',[['Soğuk İçecek','#5B8FA3',ICE_SUBS,'İçecekler','Soğuk İçecekler',ICE_COLORS],['Sıcak İçecek','#8A6E55',ICE_SUBS,'İçecekler','Sıcak İçecekler',ICE_COLORS]]]
];

function openPresets(){
  const el=h('section',{class:'view push'}),view={el,kind:'push'};
  const have=n=>cats.find(c=>fold(c.name)===fold(n));
  /* Önizleme her zaman Krem görünümüyle çizilir: Mavi temalarda kapak rengi kategoriden değil iki zemin tonundan gelir */
  const art=(name,color,sub)=>{
    const prev=curTheme,tmp={id:uid0(),name:'\u0001'+color,color};
    curTheme='krem';cats=[...cats,tmp];
    try{return plateArt(tmp.name,{plate:0,tone:0,id:'pcprev',kind:isMugCat(name,sub?{sub:name}:null)?'mug':isGlassCat(name,sub?{sub:name}:null)?'glass':isDessertCat(name)?'dessert':isMeatCat(name,sub?{sub:name}:null)?'meat':''})}finally{cats=cats.filter(c=>c!==tmp);curTheme=prev}
  };
  const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);e.target._go()}}),{rootMargin:'300px'}):null;
  const sum=h('div',{class:'pcsum'});
  const tiles=[];
  const parents=[...new Set(PRESETS.flatMap(g=>g[1].map(x=>x[3]||x[0])))],total=parents.length;
  const refresh=()=>{
    const n=parents.filter(p=>have(p)).length;
    sum.replaceChildren(h('span',{},h('b',{},String(n)),` / ${total} kategori eklendi`));
    tiles.forEach(t=>{
      const c=have(t.cat),color=c?(t.subName?(subColorOf(c.name,t.subName)||c.color):c.color):t.color;
      t.btn.classList.toggle('has',!!c);t.bd.replaceChildren(c?icon('check',16,CLAY,2.6):icon('plus',16,INK2,2.2));
      const ch=t.color!==color;t.color=color;if(ch&&t.img.getAttribute('src'))t.img._go()
    });
  };
  const mkTile=([nm,col,subs,parent,subName,sc])=>{
    const img=h('img',{alt:nm,draggable:'false'}),bd=h('span',{class:'bd'});
    const t={nm,cat:parent||nm,sub:!!parent,subName,sc,color:col,img,bd,subs};
    img._go=()=>{img.src=art(nm,t.color,t.sub)};
    const btn=h('button',{type:'button',class:'pct tap',onclick:()=>{sfx('tap');detail(t)}},h('span',{class:'im'},img,bd),h('span',{class:'nm'},nm));
    t.btn=btn;if(io)io.observe(img);else setTimeout(img._go,80);
    tiles.push(t);return btn;

  el.append(h('div',{class:'scroll'},barSp(),

/* Ayarlar sayfası: başlıklar altında gruplanır, yeni ayarlar ilgili gruba satır olarak eklenir */
/* Uygulama verilerini sıfırla: tarifler, fotoğraflar, kategoriler, tema, ön bellek, servis çalışanı; sonra ilk açılış gibi yeniden başlar */

}

/* ============ Yedekleme / Geri yükleme ============
   Biçim: standart .zip (sıkıştırmasız "store"). manifest.json + photos/*.webp.
   Fotoğraflar zaten WebP %90 olduğu için yeniden sıkıştırılmaz: görüntü kaybı yok, base64 şişmesi yok. */
const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=-1;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
const MIME={webp:'image/webp',jpg:'image/jpeg',png:'image/png'};
const extOf=b=>/png/.test(b.type)?'png':/jpe?g/.test(b.type)?'jpg':'webp';
const tick=()=>new Promise(r=>setTimeout(r));
function pk(f){const b=new Uint8Array(f.reduce((a,x)=>a+x[1],0)),v=new DataView(b.buffer);let p=0;f.forEach(([x,n])=>{n===2?v.setUint16(p,x,true):v.setUint32(p,x>>>0,true);p+=n});return b}
function zipBuild(list){
  const E=new TextEncoder(),parts=[],cd=[];let off=0,cs=0;
  for(const e of list){
    const nm=E.encode(e.name);
    parts.push(pk([[0x04034b50,4],[20,2],[0x800,2],[0,2],[0,2],[0x21,2],[e.crc,4],[e.size,4],[e.size,4],[nm.length,2],[0,2]]),nm,e.data);
    const c=pk([[0x02014b50,4],[20,2],[20,2],[0x800,2],[0,2],[0,2],[0x21,2],[e.crc,4],[e.size,4],[e.size,4],[nm.length,2],[0,2],[0,2],[0,2],[0,2],[0,4],[off,4]]);
    cd.push(c,nm);cs+=c.length+nm.length;off+=30+nm.length+e.size;
  }
  return new Blob([...parts,...cd,pk([[0x06054b50,4],[0,2],[0,2],[list.length,2],[list.length,2],[cs,4],[off,4],[0,2]])],{type:'application/zip'});
}
async function zipOpen(f){
  const tail=await f.slice(Math.max(0,f.size-65557)).arrayBuffer(),dv=new DataView(tail);
  let p=tail.byteLength-22;while(p>=0&&dv.getUint32(p,true)!==0x06054b50)p--;
  if(p<0)throw new Error('zip');
  const n=dv.getUint16(p+10,true),size=dv.getUint32(p+12,true),at=dv.getUint32(p+16,true);
  const cb=await f.slice(at,at+size).arrayBuffer(),cv=new DataView(cb),D=new TextDecoder(),map=new Map();
  for(let i=0,q=0;i<n;i++){
    if(cv.getUint32(q,true)!==0x02014b50)throw new Error('zip');
    const m=cv.getUint16(q+10,true),sz=cv.getUint32(q+20,true),nl=cv.getUint16(q+28,true),el=cv.getUint16(q+30,true),cl=cv.getUint16(q+32,true),lo=cv.getUint32(q+42,true);
    map.set(D.decode(new Uint8Array(cb,q+46,nl)),{m,sz,lo});q+=46+nl+el+cl;
  }
  return{async read(k){
    const e=map.get(k);if(!e)throw new Error('yok');
    const lh=new DataView(await f.slice(e.lo,e.lo+30).arrayBuffer()),st=e.lo+30+lh.getUint16(26,true)+lh.getUint16(28,true),b=f.slice(st,st+e.sz);
    if(e.m===0)return b;
    if(e.m===8&&window.DecompressionStream)return new Response(b.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
    throw new Error('sıkıştırma');
  }};
}
async function buildBackup(recs,kind,prog){
  const files=[],E=new TextEncoder(),out=[];
  const total=recs.reduce((a,r)=>a+(r.photos||[]).length+(r.vars||[]).filter(v=>v.photo).length+(r.log||[]).filter(e=>e.p).length,0);let done=0;
  const add=async(name,b)=>{const u=new Uint8Array(await b.arrayBuffer());files.push({name,data:b,crc:crc32(u),size:u.length});prog(++done,total);await tick()};
  prog(0,0);
  for(const r of recs){
    const{photos=[],vars=[],...rest}=r,o={...rest,photos:[],vars:[]};
    for(let k=0;k<photos.length;k++){const n=`photos/${r.id}_${k}.${extOf(photos[k])}`;await add(n,photos[k]);o.photos.push(n)}
    for(const v of vars){const{photo,...vr}=v;let pn=null;if(photo){pn=`photos/${r.id}_v_${v.id}.${extOf(photo)}`;await add(pn,photo)}o.vars.push({...vr,photo:pn})}
    if(r.log){o.log=[];for(const e of r.log){let pn=null;if(e.p){pn=`photos/${r.id}_l_${e.id}.${extOf(e.p)}`;await add(pn,e.p)}o.log.push({...e,p:pn})}}
    out.push(o);
  }
  const used=new Set(recs.map(r=>r.cat));
  const cl=(kind==='full'?cats:cats.filter(c=>used.has(c.name))).map(({id,name,color,subs,subColors,cv})=>({id,name,color,...(subs&&subs.length?{subs}:{}),...(subColors?{subColors}:{}),...(cv?{cv}:{})}));
  const mf={app:'yemek-yapalim',ver:1,kind,created:new Date().toISOString(),theme:kind==='full'?curTheme:null,cats:cl,recipes:out};
  const mb=E.encode(JSON.stringify(mf));files.unshift({name:'manifest.json',data:mb,crc:crc32(mb),size:mb.length});
  return zipBuild(files);
}
function bkName(recs,kind){
  const slug=t=>fold(t).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
  if(kind==='full')return`Yemek-Yapalim-Yedek-${today()}.zip`;
  return recs.length===1?`Yemek-Yapalim-${slug(recs[0].title)||'tarif'}.zip`:`Yemek-Yapalim-${recs.length}-tarif-${today()}.zip`;
}
function runBackup(recs,kind,after){
  if(!recs.length){toast('Yedeklenecek tarif yok');return}
  let ok=false;const box=h('div',{});
  const s=sheet(box,{guard:a=>{if(ok)a.close()},onClose:()=>{ok&&after&&after()}});
  const bar=h('i',{}),txt=h('p',{class:'sh-p'},'Hazırlanıyor…');
  box.replaceChildren(h('div',{class:'sh-t'},'Yedek hazırlanıyor'),txt,h('div',{class:'bkbar'},bar));
  const prog=(d,t)=>{txt.textContent=t?`Fotoğraflar paketleniyor · ${d} / ${t}`:'Tarifler paketleniyor…';bar.style.width=(t?d/t*100:100)+'%'};
  (async()=>{
    try{
      const blob=await buildBackup(recs,kind,prog),name=bkName(recs,kind),file=new File([blob],name,{type:'application/zip'});
      const can=!!(navigator.canShare&&navigator.canShare({files:[file]})),mb=(blob.size/1048576).toLocaleString('tr',{maximumFractionDigits:1});
      const save=async()=>{
        if(can){try{await navigator.share({files:[file],title:name});s.close();return}catch(e){if(e&&e.name==='AbortError')return}}
        const u=URL.createObjectURL(blob),a=h('a',{href:u,download:name});document.body.append(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(u),60000);toast('Yedek indirildi');s.close();
      };
      ok=true;
      box.replaceChildren(h('div',{class:'sh-t'},'Yedek hazır'),
        h('p',{class:'sh-p'},`${recs.length} tarif · ${mb} MB`+(can?'. Açılan menüden “Dosyalara Kaydet”i seçebilirsin.':'')),
        h('div',{class:'btns'},h('button',{class:'bt g tap',type:'button',onclick:()=>s.close()},'Kapat'),h('button',{class:'bt tap',type:'button',onclick:save},can?'Kaydet / Paylaş':'İndir')));
    }catch(e){s.close();toast('Yedek oluşturulamadı')}
  })();
}
async function restoreBackup(z,m,mode,prog){
  const inc=(m.cats||[]).filter(c=>c&&c.name);
  if(mode==='replace'&&m.kind==='full'&&inc.length)cats=inc.map(c=>({id:c.id||uid0(),name:c.name,color:c.color||CLAY,...(Array.isArray(c.subs)&&c.subs.length?{subs:c.subs,...(c.subColors?{subColors:c.subColors}:{})}:{}),...(c.cv&&typeof c.cv==='object'?{cv:c.cv}:{})}));
  else inc.forEach(c=>{if(!cats.some(x=>fold(x.name)===fold(c.name)))cats.push({id:c.id||uid0(),name:c.name,color:c.color||CLAY,...(Array.isArray(c.subs)&&c.subs.length?{subs:c.subs,...(c.subColors?{subColors:c.subColors}:{})}:{}),...(c.cv&&typeof c.cv==='object'?{cv:c.cv}:{})})});
  saveCats();
  const rd=async n=>{const b=await z.read(n);return new Blob([await b.arrayBuffer()],{type:MIME[n.split('.').pop()]||'image/webp'})};
  let added=0,skipped=0;const keep=new Set();
  for(let i=0;i<m.recipes.length;i++){
    const rr=m.recipes[i];keep.add(rr.id);
    const cur=state.all.find(x=>x.id===rr.id);
    if(mode==='merge'&&cur&&(cur.updated||0)>=(rr.updated||0)){skipped++;prog(i+1,m.recipes.length);continue}
    const rec={...rr,photos:[],vars:[]};
    for(const n of rr.photos||[]){try{rec.photos.push(await rd(n))}catch{}}
    for(const v of rr.vars||[]){let ph=null;if(v.photo){try{ph=await rd(v.photo)}catch{}}rec.vars.push({...v,photo:ph})}
    if(rr.log){rec.log=[];for(const e of rr.log){let ph=null;if(e.p){try{ph=await rd(e.p)}catch{}}rec.log.push({...e,p:ph})}}
    await Store.put(rec);
    const k=state.all.findIndex(x=>x.id===rec.id);k>=0?state.all[k]=rec:state.all.push(rec);
    added++;prog(i+1,m.recipes.length);await tick();
  }
  if(mode==='replace')for(const r of [...state.all])if(!keep.has(r.id)){await Store.remove(r.id);state.all=state.all.filter(x=>x!==r)}
  if(mode==='replace'&&m.kind==='full'&&m.theme&&THEMES[m.theme])setTheme(m.theme);
  bus.forEach(f=>f(true));catBus.forEach(f=>f());
  return{added,skipped};
}
async function importFlow(f){
  let z,m;
  try{z=await zipOpen(f);m=JSON.parse(await(await z.read('manifest.json')).text());if(m.app!=='yemek-yapalim'||!Array.isArray(m.recipes))throw 0}
  catch{toast('Bu bir Yemek Yapalım yedeği değil');return}
  let busy=false;const box=h('div',{}),s=sheet(box,{guard:a=>{if(!busy)a.close()}});
  const np=m.recipes.reduce((a,r)=>a+(r.photos||[]).length+(r.vars||[]).filter(v=>v.photo).length+(r.log||[]).filter(e=>e.p).length,0),full=m.kind==='full';
  const when=m.created?new Date(m.created).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'}):'';
  const head=(t,p)=>[h('div',{class:'sh-t'},t),h('p',{class:'sh-p'},p)];
  const run=async mode=>{
    busy=true;const bar=h('i',{}),txt=h('p',{class:'sh-p'},'Hazırlanıyor…');
    box.replaceChildren(h('div',{class:'sh-t'},'Geri yükleniyor'),txt,h('div',{class:'bkbar'},bar));
    try{
      const r=await restoreBackup(z,m,mode,(d,t)=>{txt.textContent=`${d} / ${t} tarif`;bar.style.width=d/t*100+'%'});
      busy=false;
      box.replaceChildren(...head('Geri yükleme tamamlandı',`${r.added} tarif eklendi ya da güncellendi`+(r.skipped?`, ${r.skipped} tarif cihazda zaten daha güncel olduğu için atlandı`:'')+'.'),
        h('div',{class:'btns'},h('button',{class:'bt tap',type:'button',onclick:()=>s.close()},'Tamam')));
    }catch(e){busy=false;s.close();toast('Geri yükleme başarısız')}
  };
  const sure=()=>box.replaceChildren(...head('Emin misin?',`Şu anki ${state.all.length} tarif silinecek, yerine yedekteki ${m.recipes.length} tarif yüklenecek.`),
    h('div',{class:'btns'},h('button',{class:'bt g tap',type:'button',onclick:choose},'Vazgeç'),h('button',{class:'bt c tap',type:'button',onclick:()=>run('replace')},'Değiştir')));
  const choose=()=>box.replaceChildren(...head('Yedek bulundu',`${m.recipes.length} tarif · ${np} fotoğraf${when?' · '+when:''}. Birleştirince mevcut tarifler korunur; yedekteki yeni ya da daha güncel olanlar eklenir.`),
    h('div',{class:'btns col'},h('button',{class:'bt tap',type:'button',onclick:()=>run('merge')},'Birleştir'),
      full?h('button',{class:'bt g tap',type:'button',onclick:sure},'Hepsini değiştir'):null));
  choose();
}
const bkIn=h('input',{type:'file',accept:'.zip,application/zip',style:'display:none',onchange:()=>{const f=bkIn.files[0];bkIn.value='';f&&importFlow(f)}});

  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

(async()=>{

  /* yazı tipleri (Fraunces / DM Sans) gelsin, harf değişimi görünmesin; en fazla 700 ms bekle */

setTimeout(()=>document.documentElement.classList.remove('boot'),4000);
