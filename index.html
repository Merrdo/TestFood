<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2EBDD">
<title>Yemek Yapalım</title>
<meta name="apple-mobile-web-app-title" content="Yemek Yapalım">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2EBDD;--paper2:#E9DFCB;--card:#FAF5EA;--card-rgb:250 245 234;--ink:#2B221B;--ink2:#7A6C5D;--ink3:var(--ink3);--ink-rgb:43 34 27;
  --line:rgb(var(--ink-rgb) / .13);--clay:#B4532F;--clay-rgb:180 83 47;--danger:#98391D;--danger-rgb:152 57 29;
  --fabc:#5E6D3B;--go:var(--fabc);--go-rgb:94 109 59;--sun:#D9A23C;--olive:#5F6B3C;--cream:#F6EFE2;--cream-rgb:246 239 226;
  --mute:var(--mute);--mute-a:var(--mute-a);--mute-b:var(--mute-b);--shd-rgb:70 40 15;--dk-rgb:30 20 12;--dk2-rgb:20 14 10;
  --c1:68 86 58;--c2:51 69 47;--c3:27 37 24;--cookink:var(--cookink);--nx1:var(--nx1);--nx2:var(--nx2);--g1:var(--g1);--g2:#D9A23C;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--H:100vh;
  --ease:cubic-bezier(.22,.9,.24,1);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:var(--H);min-height:100%;overflow:hidden;background:var(--paper);overscroll-behavior:none}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img,canvas{-webkit-touch-callout:none;-webkit-user-drag:none;user-drag:none;-webkit-user-select:none;user-select:none}
img{pointer-events:none}
input,textarea{-webkit-user-select:text;user-select:text;font-family:var(--sans);color:var(--ink)}
button{font-family:var(--sans);cursor:pointer;color:inherit}
#app{position:absolute;left:0;right:0;top:0;height:var(--H);overflow:hidden;background:var(--paper)}
#grain{display:none}
/* Doku yalnızca kâğıt zeminlerde; kartlar, fotoğraflar, butonlar ve yazılar temiz kalır */
.view,.body,.sheet,.pbar{background-image:var(--grain,none);background-size:140px 140px}
.view{position:absolute;inset:0;background:var(--paper);will-change:transform}
.view.push{box-shadow:-18px 0 50px rgb(var(--ink-rgb) / .14)}
#home{z-index:1}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.ic{display:block;pointer-events:none}
.tap{transition:transform .35s var(--ease),filter .3s,opacity .3s}
.tap:active{transform:scale(.955);filter:brightness(.94)}

/* ---------- Ana sayfa ---------- */
.head{padding:calc(var(--st) + 26px) 26px 0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);font-weight:600;animation:rise .8s var(--ease) both}
.h1{font-family:var(--serif);font-weight:400;font-size:48px;line-height:1.02;letter-spacing:-.025em;margin-top:10px;font-variation-settings:"SOFT" 100,"opsz" 144;animation:rise .9s .08s var(--ease) both}
.h1 em{font-style:italic;color:var(--clay)}
.search{position:relative;margin:26px 26px 0;display:flex;align-items:center;gap:12px;height:48px;border-bottom:1px solid var(--line);animation:rise .9s .16s var(--ease) both}
.search::after{content:'';position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--clay);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.search:focus-within::after{transform:scaleX(1)}
.search input{flex:1;background:none;border:0;outline:0;font-size:17px;height:100%;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--mute-a)}
.search input::-webkit-search-cancel-button{display:none}
.clr{width:30px;height:30px;border:0;background:var(--paper2);border-radius:50%;display:grid;place-items:center;opacity:0;transform:scale(.6);pointer-events:none;transition:all .35s var(--ease)}
.clr.on{opacity:1;transform:none;pointer-events:auto}
.cats{overflow-x:auto;scrollbar-width:none;padding:0 26px;margin-top:22px;animation:rise .9s .24s var(--ease) both}
.cats::-webkit-scrollbar{display:none}
.cats-in{position:relative;display:flex;gap:24px;width:max-content;padding-bottom:16px}
.cat{background:none;border:0;padding:4px 0;font:400 25px var(--serif);font-variation-settings:"SOFT" 100,"opsz" 72;letter-spacing:-.01em;color:var(--mute-b);transition:color .35s;white-space:nowrap}
.cat.on{color:var(--ink)}
.brush{position:absolute;left:-14px;bottom:0;height:14px;width:calc(100% + 28px);pointer-events:none}
.info{display:flex;justify-content:space-between;align-items:center;padding:6px 26px 18px;animation:rise .9s .3s var(--ease) both}
.count{font-size:13px;color:var(--ink2)}
.sortb{display:flex;align-items:center;gap:8px;background:none;border:0;font-size:13px;color:var(--ink2);padding:6px 0 6px 10px}
.list{padding-bottom:calc(var(--sb) + 150px)}
.card{display:block;margin:0 20px 30px;animation:rise .8s var(--ease) both;animation-delay:calc(var(--i)*70ms);cursor:pointer}
.list.quick .card{animation:fade .32s both;animation-delay:0s}
.card .ph{position:relative;aspect-ratio:4/3.15;border-radius:28px;overflow:hidden;background:var(--paper2);box-shadow:0 22px 34px -20px rgb(var(--shd-rgb) / .55)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s var(--ease)}
.card:active .ph img{transform:scale(1.04)}
.card .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgb(var(--dk-rgb) / .35),rgb(var(--dk-rgb) / 0) 45%);pointer-events:none}
.badge{position:absolute;left:16px;bottom:14px;z-index:2;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);font-weight:600}
.card .tt{font:400 26px/1.12 var(--serif);letter-spacing:-.015em;margin:16px 6px 0;font-variation-settings:"SOFT" 100,"opsz" 96}
.card .mt{display:flex;justify-content:space-between;align-items:center;margin:8px 6px 0;font-size:13.5px;color:var(--ink2)}
.none{padding:50px 40px;text-align:center;color:var(--ink2);font-size:15px;animation:fade .5s both}
.empty{display:flex;flex-direction:column;align-items:center;padding:34px 40px;text-align:center;animation:rise .9s .3s var(--ease) both}
.empty h3{font:400 28px var(--serif);margin-top:14px;font-variation-settings:"SOFT" 100,"opsz" 96}
.empty p{color:var(--ink2);font-size:15px;line-height:1.5;margin-top:8px;max-width:260px}

.fab{position:absolute;left:50%;bottom:calc(var(--sb) + 20px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:58px;padding:0 26px 0 22px;border-radius:29px;background:var(--fabc);color:var(--cream);font:600 16px var(--sans);border:0;box-shadow:0 16px 28px -12px rgb(var(--go-rgb) / .7),inset 0 1px 0 rgba(255,255,255,.18);z-index:20;transition:transform .45s var(--ease),padding .45s var(--ease),gap .45s var(--ease),opacity .35s}
.fab:active{transform:translateX(-50%) scale(.95)}
.fab span{max-width:160px;overflow:hidden;white-space:nowrap;transition:max-width .45s var(--ease),opacity .3s}
.fab.mini{gap:0;padding:0 20px}
.fab.mini span{max-width:0;opacity:0}
.fab.sun{background:var(--fabc)}

/* ---------- Detay ---------- */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:calc(var(--H)*.52);scrollbar-width:none;background:var(--paper2)}
.gal::-webkit-scrollbar{display:none}
.gi{flex:0 0 100%;scroll-snap-align:center;position:relative;overflow:hidden}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.vt{background:#2a1f17;display:grid;place-items:center}
.vt img{position:absolute;inset:0;opacity:.7}
.vt .pl{position:relative;z-index:2;width:74px;height:74px;border-radius:50%;background:rgb(var(--cream-rgb) / .22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.35);padding-left:4px}
.vt small{position:absolute;z-index:2;bottom:64px;left:0;right:0;text-align:center;color:var(--cream);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.gw{position:relative}
.dots{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:center;gap:6px;z-index:4;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition:all .45s var(--ease)}
.dots i.on{width:22px;background:#fff}
.dots.dk i{background:rgb(var(--ink-rgb) / .3)}
.dots.dk i.on{background:var(--ink)}
.body{position:relative;margin-top:-30px;background:var(--paper);border-radius:32px 32px 0 0;padding:30px 26px calc(var(--sb) + 150px);z-index:3}
.kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);font-weight:600}
.dt{font:400 38px/1.05 var(--serif);letter-spacing:-.025em;margin-top:10px;font-variation-settings:"SOFT" 100,"opsz" 144}
.rate{margin-top:18px;display:flex;align-items:center;gap:12px}
.rate{gap:14px}
.rn{font-size:26px;display:flex;align-items:center;height:1.15em;padding-left:14px;border-left:1px solid var(--line)}
.rw{position:relative;display:inline-block;height:1.15em;min-width:.5em;transition:width .34s var(--ease)}
.rd{display:block;white-space:nowrap;font:400 1em/1.15 var(--serif);font-variation-settings:"SOFT" 100,"opsz" 72;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em;color:var(--ink)}
.rd.z{color:var(--mute)}
.rn small{font:500 .5em var(--sans);color:var(--ink2);margin-left:3px;transform:translateY(.28em)}
.rsn{display:flex;justify-content:center;margin-top:12px}
.rsn .rn{font-size:40px;border:0;padding:0}
.rsh{text-align:center;font-size:12.5px;color:var(--ink2);margin-top:10px}
.meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta div{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.sec{font:italic 400 28px var(--serif);margin:38px 0 6px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;font-variation-settings:"SOFT" 100,"opsz" 72}
.sec small{font:500 13px var(--sans);color:var(--ink2);font-style:normal}
.ing{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line);font-size:17px;line-height:1.35;cursor:pointer}
.ing span{transition:color .3s,opacity .3s;position:relative}
.ing.done span{color:var(--ink2);opacity:.6;text-decoration:line-through;text-decoration-color:rgb(var(--ink-rgb) / .4)}
.stp{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
.stp b{font:italic 300 34px/1 var(--serif);color:var(--clay);min-width:36px;font-variation-settings:"SOFT" 100,"opsz" 144}
.stp p{font-size:17px;line-height:1.6;padding-top:3px}
.note{margin-top:30px;padding:18px 20px;background:var(--paper2);border-radius:20px;border-left:3px solid var(--clay);font-size:15.5px;line-height:1.55;color:var(--ink3)}
.fbtn{position:absolute;top:calc(var(--st) + 10px);width:44px;height:44px;border-radius:50%;background:rgb(var(--card-rgb) / .8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:0;display:grid;place-items:center;z-index:6;box-shadow:0 8px 20px -8px rgba(0,0,0,.35)}

/* ---------- Varyasyonlar ---------- */
.vchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:20px -26px 0;padding:2px 26px}
.vchips::-webkit-scrollbar{display:none}
.vc{flex:none;height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);background:none;font:500 14px var(--sans);color:var(--ink2);transition:all .45s var(--ease);display:flex;align-items:center;gap:6px}
.vc.on{background:var(--go);border-color:var(--go);color:#fff}
.vc.add{border:1px solid rgb(var(--clay-rgb) / .22);background:rgb(var(--clay-rgb) / .09);color:var(--clay);font-weight:600;padding:0 16px 0 12px;gap:5px}
.vc.add svg{flex:none}
.vname{font:italic 400 24px var(--serif);color:var(--clay);margin-top:6px;font-variation-settings:"SOFT" 100,"opsz" 72}
.ing.new{background:linear-gradient(90deg,rgb(var(--clay-rgb) / .08),transparent)}
.ing .nw{margin-left:auto;font:600 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--clay)}
.outl{margin-top:12px;font-size:13.5px;color:var(--ink2);line-height:1.5}
.vsh{max-height:calc(var(--H)*.74);overflow-y:auto;scrollbar-width:none;margin:0 -24px;padding:0 24px}
.vsh::-webkit-scrollbar{display:none}
.sheet.tall{display:flex;flex-direction:column;top:0;bottom:0;max-height:none;border-radius:0;padding:calc(var(--st) + 22px) 24px calc(var(--sb) + 18px);box-shadow:none}
.sheet.tall .grab{display:none}
.vbox{display:flex;flex-direction:column;flex:1;min-height:0}
.vbox .sh-p{margin-bottom:0}
.vbox .vsh{flex:1;min-height:0;max-height:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.vbox .btns{flex:none}

.vsh-x{position:absolute;top:calc(var(--st) + 15px);right:16px;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;flex:none;z-index:2}
.vsh .in{margin-top:6px}
.vtog{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.vtog button{border:1px solid var(--line);background:none;border-radius:16px;padding:8px 13px;font:15px var(--sans);transition:all .35s var(--ease)}
.vtog button.off{text-decoration:line-through;color:var(--ink2);background:var(--paper2);opacity:.7}
.vph{height:84px;width:84px;border-radius:18px;border:1.5px dashed rgb(var(--clay-rgb) / .5);background:rgb(var(--clay-rgb) / .05) center/cover;display:grid;place-items:center;flex:none;overflow:hidden}
.badge.vb{left:auto;right:16px}
/* ---------- Pişirme modu ---------- */
/* Pişirme modu: derin zeytin yeşili zemin, sıcak krem ve amber vurgular */
.cook{background-color:rgb(var(--c3));background-image:radial-gradient(120% 65% at 92% -8%,rgb(var(--c1)) 0%,rgb(var(--c1) / 0) 62%),radial-gradient(70% 38% at 50% 52%,rgb(var(--c1) / .22) 0%,rgb(var(--c1) / 0) 100%),radial-gradient(90% 55% at -5% 108%,rgb(var(--c2)) 0%,rgb(var(--c2) / 0) 65%);background-size:auto;background-repeat:no-repeat;color:var(--cream)}
.cook .cbtn{border:1px solid rgb(var(--cream-rgb) / .14);background:rgb(var(--cream-rgb) / .08);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ctitle{position:absolute;left:0;right:0;top:calc(var(--st) + 66px);text-align:center;font:italic 400 16px var(--serif);color:rgb(var(--cream-rgb) / .62);padding:0 70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:4}
.ctitle em{color:var(--g1);font-style:italic}
.ctop{position:absolute;left:0;right:0;top:calc(var(--st) + 12px);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:5}
.cbtn{width:44px;height:44px;border-radius:50%;border:1px solid rgb(var(--cream-rgb) / .18);background:rgb(var(--cream-rgb) / .06);display:grid;place-items:center;flex:none}
.seg{flex:1;display:flex;gap:5px}
.seg i{flex:1;height:3px;border-radius:2px;background:rgb(var(--cream-rgb) / .16);overflow:hidden}
.seg b{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.seg i.done b{transform:scaleX(1)}
.stage{position:absolute;left:0;right:0;top:calc(var(--st) + 96px);bottom:calc(var(--sb) + 130px);overflow:hidden}
.step{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 28px}
.step .k{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--g1);font-weight:600;margin-bottom:22px}
.step .k::after{content:'';flex:1;height:1px;background:rgb(var(--cream-rgb) / .16)}
.step .txt{font:400 33px/1.32 var(--serif);text-wrap:pretty;letter-spacing:-.01em;font-variation-settings:"SOFT" 100,"opsz" 72}
.step .txt.m{font-size:26px}.step .txt.s{font-size:22px;line-height:1.4}
.bignum{position:absolute;right:-6px;top:calc(var(--st) + 60px);font:italic 300 200px/1 var(--serif);color:rgb(var(--cream-rgb) / .07);pointer-events:none;z-index:1}
.cbar{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 22px);display:flex;align-items:center;gap:12px;padding:0 22px;z-index:5}
.rb{width:64px;height:64px;border-radius:50%;border:1px solid rgb(var(--cream-rgb) / .16);background:rgb(var(--cream-rgb) / .09);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;flex:none;transition:opacity .3s,transform .35s var(--ease)}
.rb.off{opacity:.3;pointer-events:none}
.nx{flex:1;height:64px;border-radius:32px;background:linear-gradient(180deg,var(--nx1),var(--nx2));color:var(--cookink);box-shadow:0 14px 30px -12px rgba(0,0,0,.55);border:0;font:600 17px var(--sans);display:flex;align-items:center;justify-content:center;gap:10px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}

/* ---------- Editör ---------- */
.ed-h{display:flex;align-items:center;gap:14px;padding:calc(var(--st) + 14px) 22px 6px}
.ed-h{justify-content:space-between;padding-left:26px;padding-right:26px}
.ed-h .cbtn{border:0;background:none;width:44px;height:44px;margin-right:-10px}
.ed-h h2{font:italic 400 26px var(--serif);font-variation-settings:"SOFT" 100,"opsz" 72}
.ed-b{padding:10px 0 calc(var(--sb) + 150px)}
.phrow{display:flex;gap:12px;overflow-x:auto;padding:12px 26px 8px;scrollbar-width:none}
.phrow::-webkit-scrollbar{display:none}
.addph{flex:none;width:112px;height:128px;border-radius:22px;border:1.5px dashed rgb(var(--clay-rgb) / .5);background:rgb(var(--clay-rgb) / .05);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:12.5px;color:var(--clay);font-weight:600}
.thumb{position:relative;flex:none;width:112px;height:128px;border-radius:22px;overflow:hidden;animation:pop .5s var(--ease) both}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb em{position:absolute;left:8px;bottom:8px;font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#fff;background:rgb(var(--dk-rgb) / .55);padding:4px 8px;border-radius:10px}
.thumb .x{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;border:0;background:rgb(var(--dk-rgb) / .6);display:grid;place-items:center}
.busy .addph{opacity:.5}
.fg{padding:0 26px;margin-top:28px}
.lab{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-bottom:4px}
.field{position:relative}
.field::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--clay);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease);pointer-events:none}
.field:focus-within::after{transform:scaleX(1)}
.in{width:100%;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;outline:0;font-size:17px;padding:11px 0;-webkit-appearance:none;appearance:none;display:block;min-height:46px}
.in.big{font:400 32px/1.15 var(--serif);padding:8px 0 12px;letter-spacing:-.02em;font-variation-settings:"SOFT" 100,"opsz" 120}
.in::placeholder{color:var(--mute)}
textarea.in{resize:none;line-height:1.55;min-height:96px}
.two{display:flex;gap:22px}.two>div{flex:1}
.fg .cats{padding:0 14px;margin:10px -14px 0;animation:none}
.sheet-root{position:absolute;inset:0;z-index:100}

<script>
(()=>{
'use strict';
/* ============ Temel ============ */
const DPR=Math.min(window.devicePixelRatio||1,3);
let INK='#2B221B',INK2='#7A6C5D',CLAY='#B4532F',CLAY2='#C9683F',DANGER='#98391D',SUN='#D9A23C',CREAM='#F6EFE2',MUTE='#B3A593',COOKINK='#26331F';
let CLAYRGB='180,83,47',INKRGB='43,34,27',INK2RGB='122,108,93',CREAMRGB='246,239,226',STAR_OFF='rgba(43,34,27,.3)';

/* ============ Temalar ============ */
const THEMEKEY='defter-theme-v1';
const THEMES={
  krem:{name:'Zeytin & Krem',desc:'Sıcak krem zemin, zeytin yeşili ve kiremit detaylar.',meta:'#F2EBDD',grain:'noise',
    js:{INK:'#2B221B',INK2:'#7A6C5D',CLAY:'#B4532F',CLAY2:'#C9683F',DANGER:'#98391D',CREAM:'#F6EFE2',MUTE:'#B3A593',COOKINK:'#26331F',INKRGB:'43,34,27',INK2RGB:'122,108,93',CREAMRGB:'246,239,226'},
    v:{'--paper':'#F2EBDD','--paper2':'#E9DFCB','--card':'#FAF5EA','--card-rgb':'250 245 234','--ink':'#2B221B','--ink2':'#7A6C5D','--ink3':'#4A3E33','--ink-rgb':'43 34 27',
      '--clay':'#B4532F','--clay-rgb':'180 83 47','--danger':'#98391D','--danger-rgb':'152 57 29','--fabc':'#5E6D3B','--go-rgb':'94 109 59','--cream':'#F6EFE2','--cream-rgb':'246 239 226',
      '--mute':'#B3A593','--mute-a':'#A99B89','--mute-b':'#ABA08F','--shd-rgb':'70 40 15','--dk-rgb':'30 20 12','--dk2-rgb':'20 14 10',
      '--c1':'68 86 58','--c2':'51 69 47','--c3':'27 37 24','--cookink':'#26331F','--nx1':'#FBF5E8','--nx2':'#EFE4CC','--g1':'#E8C57F','--g2':'#D9A23C'}},
  mavi:{name:'Mavi Sabah',desc:'Ferah taş-fildişi zemin; butonlar ve detaylar mavi.',meta:'#F5F2EC',grain:'noise',
    js:{INK:'#1B2A3D',INK2:'#5F6C7D',CLAY:'#2A68AD',CLAY2:'#4C8AD0',DANGER:'#1C438C',CREAM:'#F8FBFE',MUTE:'#A3AFBE',COOKINK:'#14304F',INKRGB:'27,42,61',INK2RGB:'95,108,125',CREAMRGB:'248,251,254'},
    v:{'--paper':'#F5F2EC','--paper2':'#E7E5DE','--card':'#FCFBF8','--card-rgb':'252 251 248','--ink':'#1B2A3D','--ink2':'#5F6C7D','--ink3':'#33445A','--ink-rgb':'27 42 61',
      '--clay':'#2A68AD','--clay-rgb':'42 104 173','--danger':'#1C438C','--danger-rgb':'28 67 140','--fabc':'#2F72BE','--go-rgb':'47 114 190','--cream':'#F8FBFE','--cream-rgb':'248 251 254',
      '--mute':'#A3AFBE','--mute-a':'#9EAAB9','--mute-b':'#A6B1BF','--shd-rgb':'24 52 92','--dk-rgb':'10 20 36','--dk2-rgb':'6 12 22',
      '--c1':'38 78 128','--c2':'27 58 100','--c3':'13 26 46','--cookink':'#14304F','--nx1':'#FFFFFF','--nx2':'#E4EEF9','--g1':'#A9D0F6','--g2':'#5FA2E6'}}
};
let curTheme='krem';const themeBus=new Set(),grainCache={};
function makeGrain(kind){
  if(grainCache[kind])return grainCache[kind];
  const c=document.createElement('canvas');
  if(kind==='dots'){ /* ince, kayık sıralı nokta dokusu (2x netlik) */
    c.width=c.height=280;const x=c.getContext('2d'),id=x.createImageData(280,280);
    for(let i=0;i<id.data.length;i+=4){id.data[i]=27;id.data[i+1]=42;id.data[i+2]=61;id.data[i+3]=Math.random()*6}
    x.putImageData(id,0,0);x.fillStyle='rgba(47,114,190,.13)';
    for(let j=0;j<7;j++)for(let i=0;i<7;i++){x.beginPath();x.arc(((10+i*20+(j%2?10:0))%140)*2,(10+j*20)*2,2.1,0,7);x.fill()}
  }else{
    c.width=c.height=140;const x=c.getContext('2d'),id=x.createImageData(140,140);
    for(let i=0;i<id.data.length;i+=4){id.data[i]=43;id.data[i+1]=34;id.data[i+2]=27;id.data[i+3]=Math.random()*11}
    x.putImageData(id,0,0);
  }
  return grainCache[kind]=c.toDataURL();
}
function applyTheme(key,boot){
  if(!THEMES[key])key='krem';const T=THEMES[key],R=document.documentElement.style;
  const oldPal={INK,INK2,CLAY,CLAY2,CREAM,MUTE,COOKINK,DANGER};
  Object.entries(T.v).forEach(([k,v])=>R.setProperty(k,v));
  ({INK,INK2,CLAY,CLAY2,DANGER,CREAM,MUTE,COOKINK,INKRGB,INK2RGB,CREAMRGB}=T.js);
  STAR_OFF=`rgba(${INKRGB},.3)`;CLAYRGB=T.v['--clay-rgb'].replace(/ /g,',');
  R.setProperty('--grain',`url(${makeGrain(T.grain)})`);
  const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=T.meta;
  curTheme=key;try{localStorage.setItem(THEMEKEY,key)}catch{}
  if(boot)return;
  /* ekrandaki canvas ikon / yıldız / onay işaretlerini yeni renge boya */
  const map={};for(const k in oldPal){const o=oldPal[k].toLowerCase();if(!(o in map))map[o]=T.js[k]}
  document.querySelectorAll('canvas').forEach(c=>{if(c._c)c._c=map[String(c._c).toLowerCase()]||c._c;c._rd&&c._rd()});
  for(const k in artCache)delete artCache[k];
  try{renderList('quick')}catch{}
  themeBus.forEach(f=>f());
}
(()=>{let k='krem';try{k=localStorage.getItem(THEMEKEY)||'krem'}catch{}applyTheme(k,true)})();
function setTheme(key){
  if(key===curTheme)return;
  const run=()=>applyTheme(key);
  if(document.startViewTransition)document.startViewTransition(run);
  else{const d=document.documentElement;d.classList.add('tsw');run();setTimeout(()=>d.classList.remove('tsw'),650)}
}
const CATKEY='defter-cats-v1';
const DEFCATS=[['Çorba','#C98446'],['Ana Yemek','#A9502D'],['Hamur İşi','#BF9A58'],['Kahvaltı','#CFA93F'],['Salata','#74834A'],['Tatlı','#B87281'],['İçecek','#668683']];
const PALETTE=['#C98446','#A9502D','#BF9A58','#CFA93F','#74834A','#B87281','#668683','#8C6A9E','#4F7C9A','#9A7B4F'];
const uid0=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function loadCats(){
  try{const a=JSON.parse(localStorage.getItem(CATKEY));if(Array.isArray(a)&&a.length&&a.every(c=>c&&c.name))return a}catch{}
  return DEFCATS.map(([name,color])=>({id:uid0(),name,color}));
}
let cats=loadCats();
const saveCats=()=>{try{localStorage.setItem(CATKEY,JSON.stringify(cats))}catch{}};
const catNames=()=>cats.map(c=>c.name);
const catColor=n=>(cats.find(c=>c.name===n)||{}).color||CLAY;
const catBus=new Set();
const EASE='cubic-bezier(.22,.9,.24,1)';
const sfx=(()=>{ /* ses katmanı: şimdilik sadece yıldız sesi; diğer isimler sessiz */
  let ac=null,out=null;
  const ctx=()=>{
    if(!ac){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ac=new A();
      out=ac.createGain();out.gain.value=.5;const c=ac.createDynamicsCompressor();out.connect(c);c.connect(ac.destination)}catch{return null}}
    if(ac.state==='suspended')ac.resume().catch(()=>{});return ac;
  };
  const SEMI=[0,2,4,7,9,12,14,16,19,21]; /* pentatonik: 10 adım = 5 yıldız × yarım */
  const freq=n=>392*Math.pow(2,SEMI[Math.max(1,Math.min(10,n))-1]/12);
  /* yumuşak, kısa cam/ahşap vuruşu */
  const tone=(f,t=0,vol=.1,dur=.32)=>{
    const a=ctx();if(!a)return;const t0=a.currentTime+t;
    [[1,'sine',1],[2,'sine',.22]].forEach(([m,type,g])=>{
      const o=a.createOscillator(),e=a.createGain();o.type=type;o.frequency.value=f*m;
      e.gain.setValueAtTime(0,t0);e.gain.linearRampToValueAtTime(vol*g,t0+.006);
      e.gain.exponentialRampToValueAtTime(.0001,t0+dur/m);
      o.connect(e);e.connect(out);o.start(t0);o.stop(t0+dur+.05);
    });
  };
  return (name,a={})=>{
    if(name!=='star')return;
    try{
      const from=a.from||0,to=a.to||0;
      if(navigator.vibrate)navigator.vibrate(4);
      if(to===0){tone(freq(2)*.5,0,.07,.22);return}
      const n=Math.round(to*2);
      if(to>from){tone(freq(n),0,.11,.36);if(to===5)tone(freq(10)*.5,.09,.06,.6)}
      else tone(freq(n)*.5,0,.07,.22);
    }catch{}
  };
})();
const $=(s,r=document)=>r.querySelector(s);
addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()});
/* Tam ekran yükseklik: iOS ana ekran uygulamasında klavye kapandıktan sonra görünüm alanı küçük kalabiliyor (alta boş şerit).
   Gerçek ekran yüksekliğini kullanıp, takılı kalırsa yeniden ölçtürüyoruz. */
const iosApp=navigator.standalone===true;
let maxH=innerHeight;
function fit(){
  const standalone=iosApp||matchMedia('(display-mode: standalone)').matches;
  let hh=Math.max(innerHeight,document.documentElement.clientHeight);
  if(standalone){
    const portrait=innerHeight>=innerWidth;
    hh=Math.max(hh,portrait?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width));
  }
  /* Klavye açıkken: uygulamayı yalnızca klavyenin üstünde kalan görünür alana sığdır */
  const ae=document.activeElement,vv=window.visualViewport;
  if(vv&&ae&&ae.matches&&ae.matches('input:not([type=file]),textarea')&&vv.height<hh-80){
    hh=Math.round(vv.height+vv.offsetTop);
  }
  document.documentElement.style.setProperty('--H',hh+'px');
  const a=document.getElementById('app');if(a)a.style.height=hh+'px';
}
function unstick(){
  maxH=Math.max(maxH,innerHeight);
  if(maxH-innerHeight>4){
    const a=document.getElementById('app');
    const keep=[...document.querySelectorAll('.scroll,.gal')].map(e=>[e,e.scrollTop,e.scrollLeft]);
    a.style.display='none';void a.offsetHeight;a.style.display='';
    keep.forEach(([e,t,l])=>{e.scrollTop=t;e.scrollLeft=l});
  }
  fit();
}
fit();
addEventListener('scroll',()=>scrollTo(0,0));
/* Klavye açılıp kapanırken yüksekliği güncelle ve imleci görünür tut */
function caretIntoView(){
  const a=document.activeElement;
  if(!a||!a.matches||!a.matches('input,textarea'))return;
  const sc=a.closest('.scroll');if(!sc)return;
  const r=a.getBoundingClientRect(),c=sc.getBoundingClientRect();
  if(r.bottom>c.bottom-24)sc.scrollTop+=r.bottom-c.bottom+24;
  else if(r.top<c.top+80)sc.scrollTop-=c.top+80-r.top;
}
if(window.visualViewport){
  visualViewport.addEventListener('resize',()=>{fit();setTimeout(caretIntoView,60)});
  visualViewport.addEventListener('scroll',()=>{fit();scrollTo(0,0)});
}
document.addEventListener('focusin',()=>{

const Store=(()=>{
  let db=null,mem=null;
  const open=()=>new Promise((res,rej)=>{
    if(!window.indexedDB)return rej();
    const r=indexedDB.open('defter-v1',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('recipes',{keyPath:'id'});
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej();
  });
  const init=async()=>{if(db||mem)return;try{db=await open()}catch{mem=new Map()}};
  const run=(mode,fn)=>new Promise((res,rej)=>{
    const t=db.transaction('recipes',mode);const rq=fn(t.objectStore('recipes'));
    t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  });
  return{
    async all(){await init();return mem?[...mem.values()]:run('readonly',s=>s.getAll())},
    async put(r){await init();if(mem){mem.set(r.id,r);return}return run('readwrite',s=>s.put(r))},
    async remove(id){await init();if(mem){mem.delete(id);return}return run('readwrite',s=>s.delete(id))}
  };
})();

  catch{bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight;

/* İnce hatlı, yumuşak köşeli yıldız */
function roundedStar(ctx,cx,cy,r,rad){
  const n=10,pts=[];
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.47:r;pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  ctx.beginPath();const m0=mid(pts[n-1],pts[0]);ctx.moveTo(m0[0],m0[1]);
  for(let i=0;i<n;i++){const p=pts[i],m=mid(p,pts[(i+1)%n]);ctx.arcTo(p[0],p[1],m[0],m[1],i%2?rad*.35:rad)}
  ctx.closePath();
}
const clamp01=v=>Math.max(0,Math.min(1,v)),eOut=p=>1-Math.pow(1-p,4);
const STAR_ON='#D49A2E';
/* Yarım yıldız destekli puan. value: 0–5, 0.5 adım */
function Stars({value=0,size=18,gap=4,interactive=false,intro=false,onChange}){
  const pad=Math.ceil(size*(interactive?.5:.3)),slot=size+gap;
  const W=size*5+gap*4,CW=W+pad*2,CH=size+pad*2;
  const [cv,x]=canvas(CW,CH);cv.style.touchAction='pan-y';cv.style.margin=`-${pad}px`;cv.style.display='block';
  cv.style.pointerEvents=interactive?'auto':'none';
  let val=intro?0:value,raf=0,down=false,pressIdx=-1;
  const S=Array.from({length:5},(_,i)=>{const t=clamp01(val-i);return{from:t,to:t,t0:0,dur:360,kind:null,press:0}});
  const fillOf=(s,now)=>s.kind?s.from+(s.to-s.from)*eOut(clamp01((now-s.t0)/s.dur)):s.to;
  const draw=now=>{
    x.clearRect(0,0,CW,CH);x.lineJoin='round';
    for(let i=0;i<5;i++){
      const s=S[i],f=fillOf(s,now),cx=pad+i*slot+size/2,cy=pad+size/2+size*.03;
      let sc=1;
      if(s.kind==='up')sc+=.07*Math.sin(Math.PI*clamp01((now-s.t0)/s.dur));
      sc*=1+.08*s.press;
      const r=size*.5*sc,rad=r*.16;
      if(f<1){roundedStar(x,cx,cy,r,rad);x.lineWidth=Math.max(1,size*.052);x.strokeStyle=STAR_OFF;x.stroke()}
      if(f>0){
        x.save();
        if(f<1){x.beginPath();x.rect(cx-r*2,cy-r*2,(cx-r*.95+r*1.9*f)-(cx-r*2),r*4);x.clip()}
        roundedStar(x,cx,cy,r,rad);x.fillStyle=x.strokeStyle=STAR_ON;x.lineWidth=Math.max(1,size*.052);x.fill();x.stroke();
        x.restore();
      }
    }
  };
  const tick=now=>{
    S.forEach((s,i)=>{
      if(s.kind&&now>=s.t0+s.dur){s.kind=null;s.from=s.to}
      s.press+=((down&&pressIdx===i?1:0)-s.press)*.2;if(Math.abs(s.press)<.004&&!(down&&pressIdx===i))s.press=0;
    });
    draw(now);
    raf=(down||S.some(s=>s.kind||s.press))?requestAnimationFrame(tick):0;
  };
  const start=()=>{if(!raf)raf=requestAnimationFrame(tick)};
  const goto=(nv,delay=0)=>{
    const now=performance.now();val=nv;
    const ch=[];S.forEach((s,i)=>{if(clamp01(nv-i)!==s.to)ch.push(i)});
    ch.forEach((i,k)=>{
      const s=S[i],t=clamp01(nv-i),cur=fillOf(s,now),up=t>cur;
      s.from=cur;s.to=t;s.kind=up?'up':'down';s.dur=up?360:220;
      s.t0=now+delay+(up?k*45:(ch.length-1-k)*25);
    });
    start();
  };
  draw(0);cv._rd=()=>draw(performance.now());
  if(intro&&value)setTimeout(()=>{if(val===0&&!down)goto(value)},420);
  if(interactive){
    /* Mekanik: dokun → tam yıldız · aynı yıldıza tekrar dokun → yarım · bir daha → boş. Sürükle → tam yıldızlar. */
    let cur=-1;
    const idxAt=e=>{const r=cv.getBoundingClientRect(),rel=e.clientX-r.left-pad;return{rel,i:Math.max(0,Math.min(4,Math.floor((rel+gap/2)/slot)))}};
    const apply=v=>{if(v!==val){const from=val;goto(v);sfx('star',{from,to:v});onChange&&onChange(v)}start()};
    cv.onpointerdown=e=>{
      down=true;cv.setPointerCapture(e.pointerId);
      const{i}=idxAt(e);cur=pressIdx=i;
      apply(val===i+1?i+.5:val===i+.5?0:i+1);
    };
    cv.onpointermove=e=>{
      if(!down)return;const{rel,i}=idxAt(e);
      if(rel<-size*.3){cur=pressIdx=-1;apply(0);return}
      if(i===cur)return;cur=pressIdx=i;apply(i+1);
    };
    cv.onpointerup=cv.onpointercancel=()=>{down=false;start()};
  }
  cv.set=v=>{val=v;S.forEach((s,i)=>{s.kind=null;s.from=s.to=clamp01(v-i)});draw(0)};
  return cv;
}

/* ============ Kategori seçici: tipografik, canvas fırça çizgisi ============ */
function CatPicker(cats,value,onChange){
  const wrap=h('div',{class:'cats'});
  const inner=h('div',{class:'cats-in'});
  const cv=h('canvas',{class:'brush'});
  const btns=cats.map(c=>h('button',{type:'button',class:'cat'+(c===value?' on':'')},c));
  inner.append(...btns,cv);wrap.append(inner);cv._rd=()=>draw();
  let cur=value,x0=0,x1=0,t0=0,t1=0,raf=0,seed=Math.random()*6;
  const target=()=>{const b=btns[cats.indexOf(cur)];return b?[b.offsetLeft,b.offsetLeft+b.offsetWidth]:[0,0]};
  const size=()=>{const w=inner.offsetWidth+28;if(cv.width!==Math.round(w*DPR)){cv.width=Math.round(w*DPR);cv.height=Math.round(14*DPR)}};
  const draw=()=>{
    size();const g=cv.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,cv.width,cv.height);g.translate(14,0);
    const a=Math.min(x0,x1),b=Math.max(x0,x1);if(b-a<2)return;
    g.lineCap=g.lineJoin='round';g.strokeStyle=CLAY;
    for(const [lw,al,off] of [[5.4,.92,0],[2.2,.5,2.4]]){
      g.lineWidth=lw;g.globalAlpha=al;g.beginPath();
      for(let px=a;px<=b;px+=4){const py=7+Math.sin(px*.07+seed+off)*1.5+off*.5;px===a?g.moveTo(px,py):g.lineTo(px,py)}
      g.lineTo(b,7+Math.sin(b*.07+seed+off)*1.5+off*.5);g.stroke();
    }
    g.globalAlpha=1;
  };
  const loop=()=>{
    const [a,b]=[t0,t1];const grow=x1<b||x0<a;
    x0+=(a-x0)*(grow?.16:.3);x1+=(b-x1)*(grow?.3:.16);
    draw();
    if(Math.abs(a-x0)>.4||Math.abs(b-x1)>.4)raf=requestAnimationFrame(loop);else{x0=a;x1=b;draw();raf=0}
  };
  const go=()=>{[t0,t1]=target();if(!raf)raf=requestAnimationFrame(loop)};
  btns.forEach((b,i)=>b.onclick=()=>{
    if(cats[i]===cur)return;cur=cats[i];sfx('tap');
    btns.forEach(k=>k.classList.toggle('on',k===b));
    wrap.scrollTo({left:b.offsetLeft+26-(wrap.clientWidth-b.offsetWidth)/2,behavior:'smooth'});
    go();onChange(cur);
  });
  requestAnimationFrame(()=>{[t0,t1]=target();x0=x1=t0;go()});
  if(window.ResizeObserver)new ResizeObserver(()=>{[t0,t1]=target();if(!raf){x0=t0;x1=t1;draw()}}).observe(inner);
  wrap.value=()=>cur;
  return wrap;
}

/* ============ Çizimler: boş durum + kapak yer tutucu ============ */
function PotArt(){
  /* Boş durum: tahtada havuç dilimleyen bıçak.
     Sahne 2B çizilir; yalnızca havuç diskleri (dilimler + kesik yüz) küçük bir eğik izdüşümle (PH, K1) 3B'den projekte edilir,
     böylece dilimler devrilirken yüzleri gerçekten dönüyor. Her şey zamanın saf fonksiyonu; tek döngü = LOOP sn. */

const app=$('#app');
const nav={stack:[],
  push(view){
    const top=this.stack.at(-1)||{el:$('#home')};
    view.el.style.zIndex=10+this.stack.length;app.insertBefore(view.el,$('#toast'));
    const modal=view.kind==='modal';
    view.el.animate(modal?[{transform:'translateY(100%)'},{transform:'none'}]:[{transform:'translateX(100%)'},{transform:'none'}],{duration:modal?540:480,easing:EASE});
    view.prevAnim=top.el.animate(modal?[{transform:'none',opacity:1},{transform:'scale(.95)',opacity:.55}]:[{transform:'none'},{transform:'translateX(-22%)'}],{duration:modal?540:480,easing:EASE,fill:'forwards'});
    view.prevEl=top.el;this.stack.push(view);
  },
  pop(from){
    const view=this.stack.pop();if(!view)return;
    const modal=view.kind==='modal';
    const a=view.el.animate([{transform:from||'none'},{transform:modal?'translateY(100%)':'translateX(100%)'}],{duration:400,easing:EASE,fill:'forwards'});
    if(view.prevAnim){
      const k=modal?[{transform:'scale(.95)',opacity:.55},{transform:'none',opacity:1}]:[{transform:'translateX(-22%)'},{transform:'none'}];
      view.prevEl.animate(k,{duration:400,easing:EASE});view.prevAnim.cancel();
    }
    a.onfinish=()=>{view.el.remove();view.onClose&&view.onClose()};
  }
};
function edgeBack(view){
  const el=view.el;let sx=null,dx=0,t0=0;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];if(t.clientX<26&&nav.stack.at(-1)===view){sx=t.clientX;dx=0;t0=Date.now()}},{passive:true});
  el.addEventListener('touchmove',e=>{if(sx==null)return;dx=Math.max(0,e.touches[0].clientX-sx);el.style.transform=`translateX(${dx}px)`},{passive:true});
  el.addEventListener('touchend',()=>{
    if(sx==null)return;const v=dx/Math.max(1,Date.now()-t0);sx=null;const from=`translateX(${dx}px)`;el.style.transform='';
    if(dx>110||v>.6)nav.pop(from);else el.animate([{transform:from},{transform:'none'}],{duration:320,easing:EASE});
  });
}
function sheet(content,{onClose,top,guard,cls}={}){
  const side=cls==='tall';/* tam ekran sayfa: diğer ekranlar gibi sağdan girer, sağa çıkar */
  const out=top?[{transform:'translateY(-36px)',opacity:0},{transform:'none',opacity:1}]:side?[{transform:'translateX(100%)'},{transform:'none'}]:[{transform:'translateY(100%)'},{transform:'none'}];
  const back=h('div',{class:'sheet-back'}),box=h('div',{class:'sheet'+(top?' top':'')+(cls?' '+cls:'')},top?null:h('div',{class:'grab'}),content);
  const root=h('div',{class:'sheet-root'},back,box);app.insertBefore(root,$('#toast'));
  back.animate([{opacity:0},{opacity:1}],{duration:300,fill:'forwards'});
  box.animate(out,{duration:top?420:500,easing:EASE});
  const api={close(){
    back.animate([{opacity:1},{opacity:0}],{duration:260,fill:'forwards'});
    const kf=side?[{transform:api._from||'none'},{transform:'translateX(100%)'}]:[...out].reverse();api._from=null;
    box.animate(kf,{duration:side?400:300,easing:EASE,fill:'forwards'}).onfinish=()=>{root.remove();onClose&&onClose()};
  }};
  back.onclick=guard?()=>guard(api):api.close;
  if(guard){
    /* Sol kenardan çekerek geri: önce guard'a sorulur (kaydedilmemiş değişiklik uyarısı) */
    let sx=null,dx=0,t0=0;
    root.addEventListener('touchstart',e=>{const t=e.touches[0];if(t.clientX<26){sx=t.clientX;dx=0;t0=Date.now()}},{passive:true});
    root.addEventListener('touchmove',e=>{if(sx==null)return;dx=Math.max(0,e.touches[0].clientX-sx);box.style.transform=`translateX(${dx*.6}px)`},{passive:true});
    const end=()=>{
      if(sx==null)return;const v=dx/Math.max(1,Date.now()-t0),from=`translateX(${dx*.6}px)`;sx=null;box.style.transform='';

      if(dx>90||v>.6){api._from=from;setTimeout(()=>{api._from=null},60);guard(api)}
    };
    root.addEventListener('touchend',end);root.addEventListener('touchcancel',end);
  }

}

  const d=rec?{...rec,photos:[...rec.photos]}:{id:uid(),title:'',cat:catNames().includes('Ana Yemek')?'Ana Yemek':(catNames()[0]||''),date:today(),rating:0,time:'',serves:'',ing:[],steps:[],video:'',note:'',photos:[],created:Date.now()};
  let dirty=false;const mark=()=>{dirty=true};
  const el=h('section',{class:'view editor'}),view={el,kind:'modal'};
  const phRow=h('div',{class:'phrow'});
  const file=h('input',{type:'file',accept:'image/*',multiple:true,style:'display:none'});
  file.onchange=async()=>{
    phRow.classList.add('busy');
    for(const f of file.files){try{d.photos.push(await compress(f))}catch{}}
    file.value='';phRow.classList.remove('busy');mark();drawPh();
  };
  function drawPh(){
    phRow.innerHTML='';
    phRow.append(h('button',{class:'addph tap',type:'button',onclick:()=>file.click()},icon('camera',28,CLAY,1.7),h('span',{},'Fotoğraf ekle')));
    d.photos.forEach((b,k)=>{
      const t=h('div',{class:'thumb',onclick:e=>{if(e.target.closest('.x'))return;sfx('tap');openViewer(d.photos,k,t)}},h('img',{src:urlOf(b),alt:''}),k===0?h('em',{},'Kapak'):null,
        h('button',{type:'button',class:'x',onclick:()=>{t.animate([{transform:'none',opacity:1},{transform:'scale(.6)',opacity:0}],{duration:240}).onfinish=()=>{d.photos.splice(d.photos.indexOf(b),1);mark();drawPh()}}},icon('close',12,'#fff',2.6)));
      phRow.append(t);
    });
  }
  drawPh();
  const grow=t=>{t.style.height='auto';t.style.height=Math.max(96,t.scrollHeight)+'px'};
  const ta=(val,ph)=>{const t=h('textarea',{class:'in',placeholder:ph,oninput:()=>{mark();grow(t)}},val);return t};
  const titleIn=h('input',{class:'in big',placeholder:'Yemeğin adı',value:d.title,autocomplete:'off',autocapitalize:'sentences',oninput:mark});
  const picker=CatPicker(catNames(),d.cat,c=>{d.cat=c;mark()});
  const dateIn=h('input',{type:'date',class:'in',value:d.date,onchange:mark});
  const timeIn=h('input',{class:'in',inputmode:'numeric',placeholder:'45',value:d.time,oninput:mark});
  const servIn=h('input',{class:'in',inputmode:'numeric',placeholder:'4',value:d.serves,oninput:mark});
  const ingTa=ta(d.ing.join('\n'),'Her satıra bir malzeme\n2 su bardağı mercimek\n1 adet soğan');
  const stepTa=ta(d.steps.join('\n'),'Her satıra bir adım\nMercimeği yıka ve süz.\nSoğanı yağda kavur.');
  const vidIn=h('input',{class:'in',type:'url',inputmode:'url',placeholder:'YouTube bağlantısı',value:d.video,autocapitalize:'off',oninput:mark});
  const noteTa=ta(d.note,'İpuçları, değişiklikler, kimin için yaptığın…');
  const stars=Stars({value:d.rating,size:38,gap:10,interactive:true,onChange:v=>{d.rating=v;mark()}});
  const fg=(label,node)=>h('div',{class:'fg'},h('div',{class:'lab'},label),node);
  const f=n=>h('div',{class:'field'},n);
  const closeB=h('button',{class:'cbtn tap',type:'button',onclick:()=>{
    if(!dirty){nav.pop();return}
    const box=h('div',{},h('div',{class:'sh-t'},'Vazgeçilsin mi?'),h('p',{class:'sh-p'},'Yaptığın değişiklikler kaydedilmeyecek.'),
      h('div',{class:'btns'},h('button',{class:'bt g tap',type:'button',onclick:()=>s.close()},'Devam et'),h('button',{class:'bt c tap',type:'button',onclick:()=>{s.close();nav.pop()}},'Vazgeç')));
    const s=sheet(box);
  }},icon('close',26,INK,2));
  async function doSave(){
    const title=titleIn.value.trim();
    if(!title){titleIn.parentElement.animate(shake,{duration:420});titleIn.focus();toast('Yemeğe bir ad ver');return}
    const out={...d,title,cat:picker.value(),date:dateIn.value||today(),time:timeIn.value.trim(),serves:servIn.value.trim(),ing:lines(ingTa.value),steps:lines(stepTa.value),video:vidIn.value.trim(),note:noteTa.value.trim()};
    await save(out);dirty=false;sfx('save');nav.pop();toast(editing?'Değişiklikler kaydedildi':'Tarif deftere eklendi');
  }
  const saveB=h('button',{class:'fab',type:'button',onclick:doSave},icon('check',24,CREAM,2.2),h('span',{},'Kaydet'));
  const body=h('div',{class:'ed-b'},
    phRow,
    fg('Başlık',f(titleIn)),
    fg('Kategori',picker),
    fg('Tarih',f(dateIn)),
    fg('Puan',h('div',{style:'margin-top:10px'},stars)),
    h('div',{class:'fg'},h('div',{class:'two'},h('div',{},h('div',{class:'lab'},'Süre (dk)'),f(timeIn)),h('div',{},h('div',{class:'lab'},'Porsiyon'),f(servIn)))),
    fg('Malzemeler',f(ingTa)),
    fg('Hazırlanışı',f(stepTa)),
    fg('Video (isteğe bağlı)',f(vidIn)),
    fg('Not',f(noteTa)));
  el.append(h('div',{class:'scroll'},h('div',{class:'ed-h'},h('h2',{},editing?'Tarifi düzenle':'Yeni tarif'),closeB),body),saveB,file);
  el.addEventListener('focusin',e=>{if(e.target.matches('input,textarea'))el.classList.add('typing')});
  el.addEventListener('focusout',()=>setTimeout(()=>{if(!el.contains(document.activeElement)||!document.activeElement.matches('input,textarea'))el.classList.remove('typing')},60));
  el.addEventListener('touchstart',e=>{const a=document.activeElement;if(a&&a.matches&&a.matches('input,textarea')&&!e.target.closest('input,textarea'))a.blur()},{passive:true});
  nav.push(view);
  setTimeout(()=>{grow(ingTa);grow(stepTa);grow(noteTa)},60);
}

/* ============ Görsel büyütme ============ */
function openViewer(list,idx,srcEl){
  const lb=h('div',{class:'lb'}),strip=h('div',{class:'lbs'});
  let cur=idx,closing=false,dragging=false,dy=0,sx=0,sy=0,track=false;
  const close=()=>{
    if(closing)return;closing=true;
    const im=imgs[cur];
    [closeB,cnt].forEach(n=>n.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'}));
    if(cur===idx&&srcEl&&srcEl.isConnected&&!dragging){
      lb.animate([{backgroundColor:'rgba(20,14,10,.96)'},{backgroundColor:'rgba(20,14,10,0)'}],{duration:360,easing:EASE,fill:'forwards'});
      im.animate([{transform:'none'},flipFrom(im,srcEl.getBoundingClientRect())],{duration:360,easing:EASE,fill:'forwards'}).onfinish=()=>lb.remove();
    }else lb.animate([{opacity:1},{opacity:0}],{duration:260,easing:EASE,fill:'forwards'}).onfinish=()=>lb.remove();
  };
  const flipFrom=(im,r)=>{
    const b=im.getBoundingClientRect(),k=Math.max(r.width/b.width,r.height/b.height);
    return{transform:`translate(${r.left+r.width/2-(b.left+b.width/2)}px,${r.top+r.height/2-(b.top+b.height/2)}px) scale(${k})`,opacity:.4};
  };
  const imgs=list.map(b=>{const im=h('img',{src:urlOf(b),alt:''});strip.append(h('div',{class:'lbi',onclick:close},im));return im});
  const cnt=h('div',{class:'lbc'}),closeB=h('button',{class:'lbx tap',type:'button','aria-label':'Kapat',onclick:close},icon('close',24,CREAM,2));
  lb.append(strip,closeB,cnt);app.insertBefore(lb,$('#toast'));
  const upd=()=>{cnt.textContent=list.length>1?`${cur+1} / ${list.length}`:''};upd();
  strip.scrollLeft=idx*strip.clientWidth;
  strip.addEventListener('scroll',()=>{cur=Math.round(strip.scrollLeft/strip.clientWidth);upd()},{passive:true});
  lb.animate([{backgroundColor:'rgba(20,14,10,0)'},{backgroundColor:'rgba(20,14,10,.96)'}],{duration:360,easing:EASE});
  const first=imgs[idx],go=()=>{
    if(srcEl&&srcEl.isConnected)first.animate([flipFrom(first,srcEl.getBoundingClientRect()),{transform:'none',opacity:1}],{duration:440,easing:EASE});
    else first.animate([{opacity:0,transform:'scale(.92)'},{opacity:1,transform:'none'}],{duration:360,easing:EASE});
  };
  first.complete?go():(first.onload=go);
  [closeB,cnt].forEach(n=>n.animate([{opacity:0},{opacity:1}],{duration:360}));
  /* aşağı çekerek kapat */
  strip.addEventListener('touchstart',e=>{if(e.touches.length>1){track=false;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY;dy=0;dragging=false;track=true},{passive:true});
  strip.addEventListener('touchmove',e=>{
    if(!track||closing)return;const t=e.touches[0],mx=t.clientX-sx,my=t.clientY-sy;
    if(!dragging&&Math.abs(my)>10&&Math.abs(my)>Math.abs(mx)*1.4)dragging=true;
    if(dragging){dy=my;const a=Math.min(1,Math.abs(dy)/420);imgs[cur].style.transform=`translateY(${dy}px) scale(${1-a*.25})`;lb.style.backgroundColor=`rgba(20,14,10,${.96*(1-a)})`}
  },{passive:true});
  strip.addEventListener('touchend',()=>{
    if(!track)return;track=false;
    if(!dragging)return;
    if(Math.abs(dy)>110){close();return}
    dragging=false;const im=imgs[cur];
    im.style.transition='transform .3s '+EASE;lb.style.transition='background-color .3s';
    im.style.transform='';lb.style.backgroundColor='rgba(20,14,10,.96)';
    setTimeout(()=>{im.style.transition='';lb.style.transition=''},320);
  });
}

/* ============ Ayarlar ============ */
async function recat(from,to){
  for(const r of state.all.filter(x=>x.cat===from)){r.cat=to;await Store.put(r)}
  bus.forEach(f=>f(true));
}
const barSp=()=>h('div',{class:'barsp'});
function pageBar(el,title){
  const bar=h('div',{class:'pbar'},
    h('button',{class:'pback tap',type:'button','aria-label':'Geri',onclick:()=>nav.pop()},icon('curve',24,INK,2)),
    h('div',{class:'ptitle'},title));
  el.append(bar);
  const sc=el.querySelector('.scroll');
  sc.addEventListener('scroll',()=>bar.classList.toggle('on',sc.scrollTop>4),{passive:true});
}
let dragOn=false;
addEventListener('touchmove',e=>{if(dragOn)e.preventDefault()},{passive:false});

/* Sürükle-bırak sıralama: bırakmadan komşular kayıp yer açar */
function sortable(list,scroller,onCommit,onDone){
  let d=null,busy=false;
  const rows=()=>[...list.children];
  list.addEventListener('pointerdown',e=>{
    if(d||busy||(e.pointerType==='mouse'&&e.button!==0))return;
    const row=e.target.closest('.crow');if(!row||e.target.closest('.cdel'))return;
    const grip=!!e.target.closest('.grip'),p={id:e.pointerId,x:e.clientX,y:e.clientY};
    let timer=0;
    const stop=()=>{clearTimeout(timer);removeEventListener('pointermove',pm);removeEventListener('pointerup',pu);removeEventListener('pointercancel',pu)};
    const pm=ev=>{if(ev.pointerId===p.id&&Math.hypot(ev.clientX-p.x,ev.clientY-p.y)>9)stop()};
    const pu=ev=>{if(ev.pointerId===p.id)stop()};
    addEventListener('pointermove',pm);addEventListener('pointerup',pu);addEventListener('pointercancel',pu);
    if(grip){e.preventDefault();stop();start(row,p)}
    else timer=setTimeout(()=>{stop();start(row,p)},220);
  });
  function start(row,p){
    const rs=rows(),i=rs.indexOf(row);
    d={row,rs,n:rs.length,from:i,to:i,rowH:row.offsetHeight,id:p.id,x0:p.x,y0:p.y,x:p.x,y:p.y,sc0:scroller.scrollTop,raf:0};
    dragOn=true;sfx('tap');
    row.classList.add('lift');rs.forEach(r=>{if(r!==row)r.classList.add('slide')});list.classList.add('dragging');
    update();
    addEventListener('pointermove',move);addEventListener('pointerup',end);addEventListener('pointercancel',end);
    loop();
  }
  function move(ev){if(!d||ev.pointerId!==d.id)return;d.x=ev.clientX;d.y=ev.clientY;update()}
  function update(){
    const dy=d.y-d.y0+(scroller.scrollTop-d.sc0),dx=d.x-d.x0;
    const cy=Math.max(-d.from*d.rowH-14,Math.min((d.n-1-d.from)*d.rowH+14,dy));
    d.row.style.transform=`translate(${Math.max(-36,Math.min(36,dx*.4))}px,${cy}px) scale(1.035)`;
    const to=Math.max(0,Math.min(d.n-1,Math.round(d.from+cy/d.rowH)));
    if(to!==d.to){
      d.to=to;sfx('tap');
      d.rs.forEach((r,j)=>{
        if(r===d.row)return;let t=0;
        if(d.from<to&&j>d.from&&j<=to)t=-d.rowH;else if(to<d.from&&j>=to&&j<d.from)t=d.rowH;
        r.style.transform=t?`translateY(${t}px)`:'';
      });
    }
  }
  function loop(){
    if(!d)return;
    const r=scroller.getBoundingClientRect(),top=r.top+100,bot=r.bottom-100;let v=0;
    if(d.y<top)v=-(top-d.y)/5;else if(d.y>bot)v=(d.y-bot)/5;
    v=Math.max(-18,Math.min(18,v));
    if(v){const before=scroller.scrollTop;scroller.scrollTop+=v;if(scroller.scrollTop!==before)update()}
    d.raf=requestAnimationFrame(loop);
  }
  function end(ev){
    if(!d||ev.pointerId!==d.id)return;
    cancelAnimationFrame(d.raf);
    removeEventListener('pointermove',move);removeEventListener('pointerup',end);removeEventListener('pointercancel',end);
    const {row,rs,from,to,rowH}=d;d=null;busy=true;dragOn=false;
    row.classList.remove('lift');row.classList.add('settle');
    row.style.transition=`transform .28s ${EASE},box-shadow .26s,background .26s`;
    row.style.transform=`translateY(${(to-from)*rowH}px)`;
    setTimeout(()=>{
      rs.forEach(r=>{r.style.transition='none';r.style.transform='';r.classList.remove('slide','lift','settle')});
      if(to!==from)list.insertBefore(row,to>from?rs[to].nextSibling:rs[to]);
      void list.offsetHeight;rs.forEach(r=>r.style.transition='');
      list.classList.remove('dragging');busy=false;
      onDone&&onDone();
      if(to!==from)onCommit(rows().map(r=>r.dataset.id));
    },300);
  }
}

/* Kategori adı: ekle / yeniden adlandır */
function nameSheet(c,done){
  const inp=h('input',{class:'in',placeholder:'Kategori adı',value:c?c.name:'',maxlength:'24',autocomplete:'off',autocapitalize:'sentences',enterkeyhint:'done',spellcheck:'false'});
  const field=h('div',{class:'field'},inp);
  const submit=()=>{
    const v=inp.value.trim().replace(/\s+/g,' ');
    if(!v){field.animate(shake,{duration:420});toast('Bir ad yaz');return}
    if(cats.some(x=>x!==c&&fold(x.name)===fold(v))){field.animate(shake,{duration:420});toast('Bu kategori zaten var');return}
    inp.blur();s.close();done(v);
  };
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit()}};
  const box=h('div',{},h('div',{class:'sh-t'},c?'Adı değiştir':'Yeni kategori'),
    h('div',{style:'margin-top:18px'},field),
    h('div',{class:'btns'},h('button',{class:'bt g tap',type:'button',onclick:()=>{inp.blur();s.close()}},'Vazgeç'),
    h('button',{class:'bt tap',type:'button',onclick:submit},c?'Kaydet':'Ekle')));
  const s=sheet(box,{top:true});inp.focus();
  if(c)inp.select();
}

/* Kategoriler sayfası */
function openCategories(){
  const el=h('section',{class:'view push'}),view={el,kind:'push'};
  const list=h('div',{class:'clist'}),scroller=h('div',{class:'scroll'});
  let noClick=0;
  const mk=c=>{
    const r=h('div',{class:'crow','data-id':c.id},
      h('span',{class:'cdot',style:`background:${c.color}`}),
      h('div',{class:'cname'},c.name),
      h('button',{class:'cdel tap',type:'button','aria-label':'Sil',onclick:ev=>{ev.stopPropagation();del(c,r)}},icon('trash',20,INK2,1.7)),
      h('div',{class:'grip'},icon('grip',22,MUTE,1)));
    r.onclick=e=>{if(Date.now()<noClick||e.target.closest('.cdel,.grip'))return;sfx('tap');rename(c)};
    return r;
  };
  const render=()=>{list.innerHTML='';cats.forEach(c=>list.append(mk(c)))};
  function rename(c){
    nameSheet(c,async v=>{
      if(v===c.name)return;
      const old=c.name;c.name=v;if(state.cat===old)state.cat=v;
      await recat(old,v);saveCats();render();catBus.forEach(f=>f());toast('Ad değiştirildi');
    });
  }
  function add(){
    nameSheet(null,v=>{
      const c={id:uid0(),name:v,color:PALETTE[cats.length%PALETTE.length]};
      cats.push(c);saveCats();render();catBus.forEach(f=>f());
      scroller.scrollTo({top:scroller.scrollHeight,behavior:'smooth'});
      list.lastElementChild.animate([{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'none'}],{duration:420,easing:EASE});
      toast('Kategori eklendi');
    });
  }
  function del(c,rowEl){
    if(cats.length<=1){toast('En az bir kategori kalmalı');return}
    const used=state.all.filter(r=>r.cat===c.name).length;
    const box=h('div',{},h('div',{class:'sh-t'},`“${c.name}” silinsin mi?`),
      h('p',{class:'sh-p'},used?`Bu kategorideki ${used} tarif silinmez. Kategorisiz kalır ve yalnızca “Tümü” altında görünür.`:'Bu kategoride tarif yok.'),
      h('div',{class:'btns'},h('button',{class:'bt g tap',type:'button',onclick:()=>s.close()},'Vazgeç'),
      h('button',{class:'bt c tap',type:'button',onclick:async()=>{
        s.close();
        cats=cats.filter(x=>x!==c);saveCats();await recat(c.name,'');
        rowEl.style.overflow='hidden';
        rowEl.animate([{height:rowEl.offsetHeight+'px',opacity:1},{height:'0px',opacity:0}],{duration:260,easing:EASE,fill:'forwards'}).onfinish=render;
        catBus.forEach(f=>f());toast('Kategori silindi');
      }},'Sil')));
    const s=sheet(box);
  }
  render();
  sortable(list,scroller,ids=>{cats=ids.map(id=>cats.find(c=>c.id===id));saveCats();catBus.forEach(f=>f())},()=>{noClick=Date.now()+350});
  scroller.append(barSp(),
    h('p',{class:'chint'},'Sırayı değiştirmek için tutup sürükle, adı değiştirmek için dokun.'),
    list,
    h('button',{class:'addcat tap',type:'button',onclick:()=>{sfx('tap');add()}},icon('plus',22,CLAY,2),'Yeni kategori'),
    h('div',{style:'height:calc(var(--sb) + 60px)'}));
  el.append(scroller);
  pageBar(el,'Kategoriler');
  nav.push(view);edgeBack(view);
}

/* Temalar sayfası: kartlara dokununca tema anında uygulanır ve hatırlanır */
function openThemes(){
  const el=h('section',{class:'view push'}),view={el,kind:'push'};
  const keys=Object.keys(THEMES);
  const cards=keys.map(k=>{
    const T=THEMES[k],v=T.v;
    const pv=h('div',{class:'tpv',style:`background-color:${v['--paper']};background-image:url(${makeGrain(T.grain)});background-size:140px 140px`},
      h('div',{class:'tpk',style:`color:${v['--clay']}`},'MEZELER'),
      h('div',{class:'tpt',style:`color:${v['--ink']}`},'Meze'),
      h('div',{class:'tpb',style:`background:${v['--fabc']};color:#fff`},'Pişirmeye başla'),
      h('div',{class:'tpc',style:`background:${v['--card']};border-color:rgb(${v['--ink-rgb']} / .1)`},
        h('i',{style:`background:${v['--ink']}`}),h('i',{class:'s',style:`background:${v['--ink2']}`}),h('i',{class:'a',style:`background:${v['--clay']}`})));
    return h('button',{type:'button',class:'tcard tap'+(curTheme===k?' on':''),onclick:()=>{sfx('tap');setTheme(k)}},pv,
      h('div',{class:'tin'},h('div',{},h('div',{class:'tn'},T.name),h('div',{class:'td'},T.desc)),h('span',{class:'trd'})));
  });
  const upd=()=>cards.forEach((b,i)=>b.classList.toggle('on',keys[i]===curTheme));
  themeBus.add(upd);view.onClose=()=>themeBus.delete(upd);
  el.append(h('div',{class:'scroll'},barSp(),h('p',{class:'chint'},'Uygulamanın renklerini seç. Seçimin bu cihazda hatırlanır.'),...cards,h('div',{style:'height:calc(var(--sb) + 40px)'})));
  pageBar(el,'Temalar');
  nav.push(view);edgeBack(view);
}

/* Ayarlar sayfası: başlıklar altında gruplanır, yeni ayarlar ilgili gruba satır olarak eklenir */
function openSettings(){
  const el=h('section',{class:'view push'}),view={el,kind:'push'};
  const count=h('small',{});
  const upd=()=>{count.textContent=`${cats.length} kategori`};upd();
  const themeLab=h('small',{},THEMES[curTheme].name),updT=()=>{themeLab.textContent=THEMES[curTheme].name};
  catBus.add(upd);themeBus.add(updT);view.onClose=()=>{catBus.delete(upd);themeBus.delete(updT)};
  const item=(ic,label,right,fn)=>h('button',{class:'sitem tap',type:'button',onclick:()=>{sfx('tap');fn()}},
    h('span',{class:'si'},icon(ic,20,CLAY,1.8)),h('span',{class:'st'},label),right,icon('next',18,MUTE,2));
  const group=(title,...items)=>h('section',{class:'sgroup'},h('h2',{class:'sh'},title),h('div',{class:'scard'},items));
  el.append(h('div',{class:'scroll'},barSp(),
    group('Tarifler',item('tag','Kategoriler',count,openCategories)),
    group('Görünüm',item('palette','Temalar',themeLab,openThemes)),
    h('div',{class:'sfoot'},'Yemek Yapalım'),
    h('div',{style:'height:calc(var(--sb) + 40px)'})));
  pageBar(el,'Ayarlar');
  nav.push(view);edgeBack(view);
}
